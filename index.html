<!doctype html>
<html lang="ko" data-skin="navy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AIX 3부서 인트라넷</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>try{var s=JSON.parse(localStorage.getItem("intra_skin"));if(s==="mono"||s==="navy")document.documentElement.setAttribute("data-skin",s);}catch(e){}</script>
<style>
/* ================= 디자인 토큰: 네이비(B) / 모노(C) ================= */
:root{
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
:root[data-skin="navy"]{
  color-scheme:dark;
  /* 전체 네이비 톤 + 차분한 블루 포인트(쨍한 빨강·분홍 대신) */
  --bg:#262e42; --panel:#2e374d; --sunk:#353f57; --line:#3e4861; --line2:#4a5570;
  --ink:#eceef5; --muted:#b0b8ca; --faint:#848da4;
  --acc:#7b93d9; --acc-soft:#3a4766; --acc-ink:#fff;
  --ok:#7fcfaa; --ok-soft:#2f4a48; --warn:#e6b877; --warn-soft:#4a4336; --bad:#e98a8a; --bad-soft:#4f3a44;
  --nav:#20283a; --nav-ink:#b0b8ca; --nav-hover:#2e374d; --nav-sel:#39435c; --nav-on:#fff; --nav-line:#313a50; --nav-acc:#8fa8e6;
  --brand-ink:#fff; --radius:12px; --shadow:0 18px 50px rgba(0,0,0,.3);
}
:root[data-skin="mono"]{
  color-scheme:light;
  --bg:#ebedf0; --panel:#fff; --sunk:#f3f4f6; --line:#e1e4e8; --line2:#cfd4da;
  --ink:#0f1115; --muted:#5b616b; --faint:#9ba1aa;
  --acc:#0f1115; --acc-soft:#e8eaee; --acc-ink:#fff;
  --ok:#1d7f55; --ok-soft:#e3f2eb; --warn:#a8650f; --warn-soft:#f7eedf; --bad:#c9302f; --bad-soft:#f9e8e8;
  --nav:#0f1115; --nav-ink:#a5abb5; --nav-hover:#1c1f25; --nav-sel:#23262d; --nav-on:#fff; --nav-line:#23262d; --nav-acc:#fff;
  --brand-ink:#fff; --radius:6px; --shadow:0 16px 40px rgba(15,17,21,.14);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:var(--font);color:var(--ink);background:var(--bg);font-size:14px;letter-spacing:-.01em;word-break:keep-all}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
svg{flex:none}

/* ================= 뼈대 ================= */
.shell{display:grid;height:100%;min-height:0}
[data-skin] .shell{grid-template-columns:248px minmax(0,1fr)}

.top{background:var(--nav);color:var(--nav-ink);display:flex;min-width:0;min-height:0;position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:10px;color:var(--brand-ink);font-weight:700;font-size:15px;letter-spacing:-.03em;white-space:nowrap;text-align:left}
.brand > span:last-child{display:block}
.brand .mk{width:28px;height:28px;border-radius:8px;background:#e4002b;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:0}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--nav-ink);letter-spacing:0}
.gnb{display:flex;min-width:0}
.gnb .g{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--nav-ink);white-space:nowrap;transition:color .15s,background .15s}
.gnb .g:hover{color:var(--nav-on)}
.gnb .g.on{color:var(--nav-on)}
.gnb .g i.d{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.gnb .g svg{width:16px;height:16px;margin:0 -1px 0 -4px}
.gnb .g .cnt{font-size:11px;font-weight:500;color:var(--faint)}
.gnb .sub{display:none}
.tools{display:flex;align-items:center;gap:2px}
.tb{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;font-size:12.5px;color:var(--nav-ink);white-space:nowrap}
.tb:hover{background:var(--nav-hover);color:var(--nav-on)}
.tb svg{width:15px;height:15px}
.seg{display:inline-flex;border:1px solid var(--nav-line);border-radius:8px;padding:2px;gap:2px}
.seg button{padding:4px 9px;border-radius:6px;font-size:11.5px;font-weight:600;color:var(--nav-ink)}
.seg button.on{background:var(--nav-on);color:var(--nav)}

/* ---- 네이비: 왼쪽 세로 메뉴 ---- */
[data-skin] .top{flex-direction:column;padding:16px 12px 12px;border-right:1px solid var(--nav-line);overflow:hidden}
[data-skin] .brand{padding:2px 8px 18px}
[data-skin] .gnb{flex-direction:column;gap:1px;overflow:auto;flex:1;min-height:0;scrollbar-width:thin;margin:0 -4px;padding:0 4px}
[data-skin] .gnb .g{padding:9px 10px;border-radius:8px;font-size:13.5px;position:relative}
[data-skin] .gnb .g:hover{background:var(--nav-hover)}
[data-skin] .gnb .g.on{background:var(--nav-sel)}
[data-skin] .gnb .g.on::before{content:"";position:absolute;left:-4px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--nav-acc)}
[data-skin] .gnb .g .cnt{margin-left:auto}
[data-skin] .gnb .sub{display:flex;flex-direction:column;padding:2px 0 8px 27px;position:relative}
[data-skin] .gnb .sub::before{content:"";position:absolute;left:13px;top:2px;bottom:10px;width:1px;background:var(--nav-line)}
[data-skin] .gnb .sub button{text-align:left;padding:6px 10px;border-radius:7px;font-size:12.5px;color:var(--nav-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s,background .15s}
[data-skin] .gnb .sub button:hover{color:var(--nav-on);background:var(--nav-hover)}
[data-skin] .gnb .sub button.on{color:var(--nav-on);font-weight:600;background:var(--nav-hover)}
[data-skin] .gnb .sub button.on::before{content:"";position:absolute;left:11px;width:5px;height:5px;margin-top:6px;border-radius:50%;background:var(--nav-acc)}
[data-skin] .tools{flex-direction:column;align-items:stretch;gap:1px;border-top:1px solid var(--nav-line);padding-top:10px;margin-top:10px}
[data-skin] .tools .seg{margin:0 10px 6px;align-self:flex-start}
[data-skin] .tools .lbl{font-size:11px;color:var(--faint);padding:2px 10px 4px}

/* 모노: 대분류에 마우스를 올리면 뜨는 하위 목록 */
.dd{position:fixed;z-index:30;min-width:250px;background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px}
.dd button{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;padding:9px 12px;border-radius:calc(var(--radius) - 2px)}
.dd button:hover,.dd button.on{background:var(--sunk)}
.dd b{font-size:13.5px;font-weight:600}
.dd span{font-size:11.5px;color:var(--muted)}

/* ================= 본문 ================= */
.stage{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0;background:var(--bg)}
.subtabs{display:none;align-items:stretch;gap:2px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs .st-t{display:flex;align-items:center;font-size:12px;font-weight:700;color:var(--faint);padding-right:12px;margin-right:6px;border-right:1px solid var(--line);white-space:nowrap}
.subtabs button{padding:11px 12px 9px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s}
.subtabs button:hover{color:var(--ink)}
.subtabs button.on{color:var(--ink);border-bottom-color:var(--ink)}

.view{position:relative;min-width:0;min-height:0;grid-row:2}
.subtabs{grid-row:1}
.view iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.view iframe.off{visibility:hidden;pointer-events:none}
.enter{animation:enter .32s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){ .enter{animation:none} }
.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:3}
.spin{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line2);border-top-color:var(--acc);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ================= 홈 ================= */
.home{position:absolute;inset:0;overflow:auto;z-index:2;padding:28px 32px 48px;background:var(--bg)}
.home-in{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:22px 24px}
.hero .dt{font-size:12px;color:var(--faint);font-weight:600}
.hero h1{margin:2px 0 0;font-size:22px;letter-spacing:-.035em}
.hero p{margin:4px 0 0;color:var(--muted);font-size:13px}
.hero .kbd{display:flex;gap:6px;flex-wrap:wrap}
.kbd span{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--sunk)}
.sec-t{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px -6px;font-size:13px;font-weight:700;color:var(--muted)}
.recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.rc{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;transition:border-color .15s,transform .15s}
.rc:hover{border-color:var(--line2);transform:translateY(-1px)}
.rc b{display:block;font-size:13.5px}
.rc small{display:block;font-size:11.5px;color:var(--faint)}
.ico{width:36px;height:36px;border-radius:calc(var(--radius) - 3px);display:grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--c) 16%,var(--panel));color:color-mix(in srgb,var(--c) 75%,var(--ink))}
[data-skin="mono"] .ico{background:var(--sunk);color:var(--ink)}
.ico svg{width:18px;height:18px}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;align-items:start}
.group{overflow:hidden}
.group-h{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line)}
.group-h h2{margin:0;font-size:14.5px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.group-h h2 i{width:8px;height:8px;border-radius:50%;background:var(--c)}
[data-skin="mono"] .group-h h2 i{border-radius:2px;background:var(--ink)}
.group-h button{font-size:12px;color:var(--faint)}
.group-h button:hover{color:var(--ink)}
.item{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);transition:background .15s}
.item:last-child{border-bottom:0}
.item:hover{background:var(--sunk)}
.item b{display:block;font-size:14px}
.item small{display:block;font-size:12px;color:var(--muted);margin-top:1px;line-height:1.5}
.item em{display:inline-block;margin-top:5px;font-style:normal;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--sunk);color:var(--muted)}
.item:hover em{background:var(--panel)}
.arr{color:var(--faint);transition:transform .15s,color .15s}
.item:hover .arr{color:var(--acc);transform:translateX(2px)}
.empty-g{padding:18px;color:var(--faint);font-size:13px}
.note{font-size:12px;color:var(--faint);line-height:1.7;padding:0 2px}

/* ================= 통합 로그인 ================= */
.sso{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;padding:24px 16px;overflow:auto}
[data-skin] .sso{background:radial-gradient(900px 500px at 20% 0%,#33405c 0%,transparent 60%),var(--bg)}
.sso-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--radius) + 4px);box-shadow:var(--shadow);padding:30px 28px;animation:enter .35s var(--ease)}
.sso-form{display:flex;flex-direction:column;gap:12px}
.sso-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.03em}
.sso-brand::before{content:"SBS";width:30px;height:30px;border-radius:8px;background:#e4002b;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:0}
.sso-brand b{font-weight:700}
.sso-brand small{font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.sso-sub{margin:-2px 0 6px;color:var(--muted);font-size:13px;line-height:1.5}
.sso-form label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:500}
.sso-form .f{font-size:14px;padding:10px 12px}
.sso-form .btn.primary{padding:11px;justify-content:center;display:flex}
.sso-err{color:var(--bad);font-size:12.5px}
.sso-err:empty{display:none}
.sso-row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sso-link{font-size:12.5px;color:var(--muted);padding:4px 0}
.sso-link:hover{color:var(--ink)}
.sso-hint{margin:0;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
.sso-state{display:flex;flex-direction:column;gap:3px;padding:12px;border-radius:calc(var(--radius) - 4px);font-size:12.5px;color:var(--muted);line-height:1.55}
.sso-state b{font-size:13.5px}
.sso-state.wait{background:var(--warn-soft)} .sso-state.wait b{color:var(--warn)}
.sso-state.no{background:var(--bad-soft)} .sso-state.no b{color:var(--bad)}
.sso-fails{display:flex;flex-direction:column;gap:8px}
.sso-fail{border:1px solid var(--line);border-radius:calc(var(--radius) - 4px);padding:10px 12px;display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.sso-fail span{color:var(--muted)}
.sso-inline{display:flex;gap:6px;margin-top:4px}
.sso-inline .f{flex:1}
.sso .loadbox{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--muted);padding:20px 0}

/* 사용자 표시 */
.uchip{display:flex;align-items:center;gap:4px;min-width:0}
.uchip:empty{display:none}
.uchip .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);font-size:11px;font-weight:700;flex:none}
[data-skin="mono"] .uchip .av{background:#fff;color:#0f1115}
/* 네이비: 분류 색도 톤을 낮춰 배경에 어울리게 */
[data-skin="navy"] .gnb .g i.d,[data-skin="navy"] .group-h h2 i{background:color-mix(in srgb,var(--c) 55%,#c3cdea)}
[data-skin="navy"] .ico{background:color-mix(in srgb,var(--c) 18%,var(--panel));color:color-mix(in srgb,var(--c) 45%,#d6ddf2)}
[data-skin="navy"] .uchip .av{background:#3a4766;color:#dfe6fb}
.uchip .uc-name{font-size:12.5px;font-weight:600;color:var(--nav-on);padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uchip .uc-name small{display:block;font-weight:400;font-size:11px;color:var(--faint)}
.uchip button{padding:5px 8px;border-radius:6px;font-size:12px;color:var(--nav-ink);white-space:nowrap}
.uchip button:hover{background:var(--nav-hover);color:var(--nav-on)}
.uchip em{font-style:normal;background:var(--acc);color:var(--acc-ink);border-radius:99px;padding:0 6px;font-size:10.5px;margin-left:3px}
[data-skin="mono"] .uchip em{background:#ff5468;color:#fff}
[data-skin] .uchip{flex-wrap:wrap;padding:10px 8px 0;margin-top:8px;border-top:1px solid var(--nav-line)}
[data-skin] .uchip .uc-name{flex:1}
[data-skin] .uchip .ub{display:flex;gap:2px;width:100%;margin-top:6px}

/* ================= 팀원 관리(가입 승인) ================= */
.u-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:calc(var(--radius) - 2px);overflow:hidden}
.u-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.u-row:last-child{border-bottom:0}
.u-row .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted);font-size:11.5px;font-weight:700}
.u-who{min-width:0}
.u-who b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-who b em{font-style:normal;font-size:10.5px;font-weight:700;color:var(--acc);background:var(--acc-soft);border-radius:5px;padding:1px 6px;margin-left:4px}
.u-who small{display:block;font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-st{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.u-st.pending{background:var(--warn-soft);color:var(--warn)}
.u-st.approved{background:var(--ok-soft);color:var(--ok)}
.u-st.rejected,.u-st.disabled{background:var(--bad-soft);color:var(--bad)}
.u-act{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.loadbox{display:flex;justify-content:center;padding:26px 0}
@media (max-width:760px){
  .u-row{grid-template-columns:34px minmax(0,1fr) auto}
  .u-act{grid-column:1 / -1;justify-content:flex-start}
}

/* ================= 새 공지 N 배지 ================= */
.nbadge{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;margin-left:6px;border-radius:99px;
  background:#ff4d5e;color:#fff;font-size:10px;font-weight:800;font-style:normal;letter-spacing:0;line-height:1;vertical-align:1px;
  box-shadow:0 0 0 2px color-mix(in srgb,#ff4d5e 25%,transparent);animation:nbpulse 2.4s ease-in-out infinite}
@keyframes nbpulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,#ff4d5e 0%,transparent)}}
@media (prefers-reduced-motion: reduce){ .nbadge{animation:none} }
.gnb .sub button .nbadge{margin-left:5px}
.newsbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;border-radius:var(--radius);
  background:color-mix(in srgb,#ff4d5e 12%,var(--panel));border:1px solid color-mix(in srgb,#ff4d5e 40%,var(--line))}
.newsbtn .nbadge{margin:0}
.newsbtn span b{display:block;font-size:14px}
.newsbtn small{display:block;font-size:12px;color:var(--muted)}
.newsbtn .arr{margin-left:auto;color:var(--faint)}
.newsbtn:hover .arr{color:var(--ink)}

/* ================= 공통 입력·버튼·모달 ================= */
.f{border:1px solid var(--line2);border-radius:calc(var(--radius) - 4px);padding:8px 10px;font-size:13px;background:var(--panel);min-width:0;width:100%;transition:border-color .15s,box-shadow .15s}
.f:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent)}
input[type=color].f{padding:2px;height:34px;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:calc(var(--radius) - 4px);border:1px solid var(--line2);font-size:13px;font-weight:600;background:var(--panel);transition:border-color .15s,filter .15s}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.left{margin-right:auto}
.mw{position:fixed;inset:0;z-index:50;background:rgba(5,8,15,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--radius) + 4px);width:100%;max-width:880px;box-shadow:var(--shadow);animation:enter .28s var(--ease)}
.m-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.m-h h2{margin:0;font-size:17px}
.m-h button{font-size:20px;color:var(--faint);padding:0 6px}
.m-b{padding:18px 22px;display:flex;flex-direction:column;gap:22px}
.m-b h3{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.m-b h3 small{font-weight:400;color:var(--muted);font-size:12px}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;gap:6px;align-items:center}
.row.g{grid-template-columns:34px minmax(0,1fr) auto auto auto}
.row.a{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) 130px auto auto auto}
.sb{padding:6px 9px;border:1px solid var(--line2);border-radius:calc(var(--radius) - 5px);font-size:12px;color:var(--muted);white-space:nowrap;background:var(--panel)}
.sb:hover{color:var(--ink);border-color:var(--ink)}
.sb:disabled{opacity:.35;cursor:default}
.sb.danger{color:var(--bad)}
.chk{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.chk input{accent-color:var(--acc)}
.hint{font-size:12px;color:var(--muted);line-height:1.6;background:var(--sunk);border-radius:calc(var(--radius) - 4px);padding:10px 12px}
.m-f{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:60;animation:enter .25s var(--ease)}

/* ================= 인쇄: 메뉴·로그인 창은 빼고 업무 화면만 ================= */
@media print{
  .top,.subtabs,.dd,.sso,#modalRoot,#userRoot,.toast{display:none!important}
  [data-skin] .shell{display:block;height:auto}
  .stage{display:block}
  .view{position:static}
  .view iframe{position:static;height:100vh}
  .view iframe.off{display:none}
  .home{position:static}
}

/* ================= 좁은 화면: 두 테마 모두 상단 바 + 하위 탭 ================= */
@media (max-width:760px){
  [data-skin] .shell{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  [data-skin] .top{flex-direction:row;flex-wrap:wrap;padding:0;border-right:0;border-bottom:1px solid var(--nav-line);overflow:visible}
  [data-skin] .brand{padding:0 14px;height:48px;min-width:0}
  [data-skin] .brand small{display:none}
  [data-skin] .gnb{order:3;flex:0 0 100%;flex-direction:row;overflow-x:auto;height:42px;margin:0;padding:0 6px;border-top:1px solid var(--nav-line);scrollbar-width:none}
  [data-skin] .gnb .grp{display:flex}
  [data-skin] .gnb .g{padding:0 12px;font-size:13.5px;border-radius:0;background:none!important}
  [data-skin] .gnb .g::before{display:none}
  [data-skin] .gnb .g .cnt{display:none}
  [data-skin] .gnb .g.on{box-shadow:inset 0 -2px 0 var(--nav-on)}
  [data-skin] .gnb .sub{display:none}
  [data-skin] .tools{flex-direction:row;margin:0 0 0 auto;padding:0 6px;border:0;align-items:center}
  [data-skin] .tools .opt,[data-skin] .tools .lbl{display:none}
  [data-skin] .tools .seg{margin:0}
  [data-skin] .uchip{border:0!important;margin:0!important;padding:0 0 0 4px!important;flex-wrap:nowrap}
  [data-skin] .uchip .uc-name{display:none}
  [data-skin] .uchip .ub{width:auto!important;margin:0!important}
  [data-skin] .subtabs.has{display:flex;padding:0 10px}
  .subtabs .st-t{display:none}
  .home{padding:18px 14px 40px}
  .groups{grid-template-columns:minmax(0,1fr)}
  .row.g{grid-template-columns:34px minmax(0,1fr) auto auto}
  .row.a{grid-template-columns:1fr 1fr}
  .dd{display:none!important}
}

function normalize(c){
  c = JSON.parse(JSON.stringify(c || {}));
  c.groups = (c.groups || []).filter(function(g){ return g && g.id; });
  c.apps = (c.apps || []).filter(function(a){ return a && SRC_IDS.indexOf(a.src) >= 0; });

  FILE_CFG.apps.forEach(function(fa){
    if(!c.apps.some(function(a){ return a.src === fa.src; })) c.apps.push(JSON.parse(JSON.stringify(fa)));
  });
  c.apps.forEach(function(a){ if(!c.groups.some(function(g){ return g.id === a.group; })) a.group = c.groups.length ? c.groups[0].id : ""; });

    'if(MENTORS.indexOf(' + nm + ')<0) return ' + (admin ? 'true' : 'false') + ';' +
    'currentSelectedMentor=' + nm + '; renderAllMentorUIs(); filterList(); return true; })()'; },
  // 수강생 대시보드: 수강생 목록의 멘토 탭을 로그인한 사람으로 눌러 준다
  schedule: function(nm){ return '(function(){ var nm=' + nm + ';' +
    'var hit=function(sel){ return [].slice.call(document.querySelectorAll(sel)).filter(function(x){' +
    '  return x.textContent.replace(/[0-9]+/g,"").trim()===nm; })[0]; };' +
    'var b=hit(\'[data-act="lm"]\') || hit(\'[data-act="mfilter-one"]\');' +
    'if(!b) return false;' +
    'var on=b.classList.contains("on") || (b.closest(".mwrap")||{classList:{contains:function(){return false}}}).classList.contains("on");' +
    'if(!on) b.click();' +
    'return true; })()'; },
  // 3-1팀 퇴근보고: 로그인 계정을 같은 이름의 멘토와 연결.

  report: function(nm, admin){ return '(function(){ var nm=' + nm + ', admin=' + (admin ? 'true' : 'false') + ';' +
    'if(typeof S==="undefined"||!S.mentors||typeof Cloud==="undefined") return false;' +
    'if(!Cloud.on||!Cloud.user) return false;' +

function applyIdent(id, f){

function go(gid, src, replace){
  if(!SSO.ready) return;
  var a = src && appOf(src);
  if(a && a.hidden) a = null;

  if(gid && !appsIn(gid).length) gid = null;
  if(gid && !a){
    a = appOf(S.lastApp[gid]);
    if(!a || a.group !== gid || a.hidden) a = appsIn(gid)[0];
  }
  S.group = gid || null; S.app = a ? a.src : null;
  var prevApp = S._shown;
  $("#home").hidden = !!a;
  if(a && !frames[a.src]) makeFrame(a.src);
  Object.keys(frames).forEach(function(k){ frames[k].classList.toggle("off", !a || k !== a.src || !frames[k]._ready); });
  var shownNow = a ? a.src : "";
  if(shownNow !== prevApp){
    var el = a ? frames[a.src] : $("#home");
    if(el){ el.classList.remove("enter"); void el.offsetWidth; el.classList.add("enter"); }
    S._shown = shownNow;
  }
  if(a){
    $("#loading").hidden = !!frames[a.src]._ready;
    S.lastApp[gid] = a.src; lsSet("intra_last", S.lastApp);
    var rec = (lsGet("intra_recent") || []).filter(function(x){ return x !== a.src; });
    rec.unshift(a.src); lsSet("intra_recent", rec.slice(0,6));

    renderHome();
  }
  var hash = a ? "#" + a.src : "";
  if(location.hash !== hash) history[replace ? "replaceState" : "pushState"](null, "", hash || location.pathname + location.search);

}

function hotkey(e){
  if((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === "p" || e.key === "P")){
    e.preventDefault(); printCurrent(); return;
  }
  if(e.key === "Escape"){ closeDD(); if(E) closeEditor(); if($("#userRoot").innerHTML) closeUsers(); }
  if(!e.altKey || e.ctrlKey || e.metaKey) return;
  if(e.key === "0"){ e.preventDefault(); go(null, null); return; }
  var n = parseInt(e.key, 10), vg = visGroups();
  if(n >= 1 && n <= vg.length){ e.preventDefault(); go(vg[n-1].id, null); }
}

var COLOR_RE = /#[0-9a-fA-F]{3,8}\b|rgba?\([^()]*\)|hsla?\([^()]*\)|\b(?:white|black)\b(?!-)/gi;

function hsl2rgb(h, s, l){

function parseColor(s){
  s = s.trim().toLowerCase();
  if(s === "white") return {r:255,g:255,b:255,a:1};
  if(s === "black") return {r:0,g:0,b:0,a:1};
  if(s[0] === "#"){
    var h = s.slice(1);
    if(h.length === 3 || h.length === 4) h = h.split("").map(function(c){ return c+c; }).join("");
    if(h.length !== 6 && h.length !== 8) return null;
    return {r:parseInt(h.slice(0,2),16), g:parseInt(h.slice(2,4),16), b:parseInt(h.slice(4,6),16), a:h.length === 8 ? parseInt(h.slice(6,8),16)/255 : 1};
  }
  var m = s.match(/^(rgba?|hsla?)\((.*)\)$/); if(!m) return null;
  var p = m[2].split(/[\s,\/]+/).filter(Boolean);
  if(p.length < 3 || p.some(function(x){ return /var|calc|none|from/.test(x); })) return null;
  var num = function(x, max){ return /%$/.test(x) ? parseFloat(x)/100*max : parseFloat(x); };
  var a = p[3] != null ? num(p[3], 1) : 1;
  if(m[1][0] === "r") return {r:num(p[0],255), g:num(p[1],255), b:num(p[2],255), a:a};
  var c = hsl2rgb(parseFloat(p[0]), num(p[1],1), num(p[2],1));
  return {r:c[0], g:c[1], b:c[2], a:a};
}
function info(c){
  var r = c.r/255, g = c.g/255, b = c.b/255, mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx - mn, h = 0;
  if(d){ h = mx === r ? ((g-b)/d) % 6 : mx === g ? (b-r)/d + 2 : (r-g)/d + 4; h = (h*60 + 360) % 360; }
  var l = (mx+mn)/2, s = d ? d/(1-Math.abs(2*l-1)) : 0;
  return {h:h, s:s, l:l, chroma:d};
}
function ramp(st, l){
  if(l <= st[0][0]) return st[0][1];
  for(var i=1;i<st.length;i++){

      var a = st[i-1], b = st[i], t = (l - a[0]) / (b[0] - a[0] || 1);
      return [a[1][0]+(b[1][0]-a[1][0])*t, a[1][1]+(b[1][1]-a[1][1])*t, a[1][2]+(b[1][2]-a[1][2])*t];
    }
  }
  return st[st.length-1][1];
}
function fmt(rgb, a){
  var r = Math.round(rgb[0]), g = Math.round(rgb[1]), b = Math.round(rgb[2]);
  if(a >= 1) return "#" + [r,g,b].map(function(x){ return (x < 16 ? "0" : "") + Math.max(0,Math.min(255,x)).toString(16); }).join("");
  return "rgba(" + r + ", " + g + ", " + b + ", " + (Math.round(a*1000)/1000) + ")";
}
var hueNear = function(h, list){ return list.some(function(x){ var d = Math.abs(h - x) % 360; return Math.min(d, 360-d) <= 10; }); };

function mapColor(c, ctx, prop, literal){
  var P = ctx.pal, dn = ctx.native === "dark", I = info(c);
  var isShadow = /shadow/.test(prop);
  // 그림자: 원래 어두운 화면의 짙은 그림자만 밝은 테마에서 옅게
  if(isShadow && I.chroma < .1 && I.l < .35){
    if(dn && !P.dark) return fmt([15,17,21], c.a * .3);
    return null;
  }
  // 흰 글자(색 배경 위 글자)는 그대로
  if(literal && prop === "color" && I.chroma < .05 && I.l >= .985 && c.a >= .9) return null;
  var neutral = I.chroma < .1 || I.l < .06 || I.l > .97;
  if(!neutral && I.chroma >= .12 && hueNear(I.h, ctx.brand)){
    var soft = dn ? I.l <= .3 : I.l >= .85;
    return fmt(soft ? P.accSoft : P.acc, c.a);
  }
  if(neutral){
    if(literal && !dn && P.solid && I.l < .3 && /background/.test(prop) && c.a > .5) return fmt(ramp(P.solid, I.l), c.a);
    return fmt(ramp(dn ? P.darkN : P.light, I.l), c.a);

  // 상태색(초록·주황·빨강 등): 색상은 유지하고 밝기만 테마에 맞춤

    }
    return fmt(hsl2rgb(I.h, Math.min(I.s,.55), Math.max(.66, Math.min(I.l + .22, .74))), c.a);

    if(I.l <= .3) return fmt(hsl2rgb(I.h, Math.min(I.s,.55), .92), c.a);

function mapValue(val, ctx, prop, literal){
  if(!COLOR_TEST.test(val)) return val;

  return val.replace(COLOR_RE, function(m){
    var c = parseColor(m); if(!c) return m;
    var out = mapColor(c, ctx, prop, literal);
    return out == null ? m : out;

function Skinner(win, key){
  var doc = win.document, meta = APP_SKIN[key] || {native:"light", brand:[]};
  var recs = [], removed = [], inline = new Set(), origAttr = new WeakMap(), lastAttr = new WeakMap(), sheets = new WeakSet();
  var ctx = null, obs = null, on = false, busy = false;

  function doStyle(st){
    var ch = [];
    for(var i=0;i<st.length;i++){
      var p = st[i];
      if(!COLOR_PROP.test(p)) continue;
      var v = st.getPropertyValue(p);
      if(!v || !COLOR_TEST.test(v)) continue;
      var nv = mapValue(v, ctx, p, p.slice(0,2) !== "--");
      if(nv !== v) ch.push([p, v, nv, st.getPropertyPriority(p)]);
    }
    ch.forEach(function(x){ st.setProperty(x[0], x[2], x[3]); });
    return ch;
  }
  function walk(list, parent){
    for(var i=list.length-1;i>=0;i--){
      var r = list[i];
      if(r.type === 4 && r.media){
        var mt = r.media.mediaText || "";
        if(/prefers-color-scheme:\s*dark/.test(mt)){ removed.push([parent, i, r.cssText]); parent.deleteRule(i); continue; }
        if(/print/.test(mt) && !/screen/.test(mt)) continue;
      }
      if(r.selectorText && meta.drop && meta.drop.test(r.selectorText)){ removed.push([parent, i, r.cssText]); parent.deleteRule(i); continue; }
      if(r.selectorText && meta.keep && meta.keep.test(r.selectorText)) continue;
      if(r.style){ var ch = doStyle(r.style); if(ch.length) recs.push([r.style, ch]); }
      if(r.cssRules && r.cssRules.length) walk(r.cssRules, r);
    }
  }
  function doSheet(sh){
    if(!sh || sheets.has(sh)) return;
    var rules; try{ rules = sh.cssRules; }catch(e){ return; }   // 다른 도메인 CSS(글꼴 등)는 건너뜀
    sheets.add(sh);
    walk(rules, sh);
  }
  function doEl(el){
    if(el.nodeType !== 1) return;
    if(meta.keepEl && el.closest(meta.keepEl)) return;
    if(el.hasAttribute("style")){
      var cur = el.getAttribute("style");
      if(lastAttr.get(el) !== cur){
        origAttr.set(el, cur);
        var ch = doStyle(el.style);
        lastAttr.set(el, el.getAttribute("style"));
        if(ch.length) inline.add(el);
      }
    }
    ["fill","stroke"].forEach(function(a){
      var v = el.getAttribute(a); if(!v || el["_sk_" + a] === v) return;
      el["_sk0_" + a] = v;
      var nv = mapValue(v, ctx, a, true);
      el["_sk_" + a] = nv; if(nv !== v){ el.setAttribute(a, nv); inline.add(el); }
    });

  function scan(root){
    doEl(root);
    if(root.querySelectorAll) Array.prototype.forEach.call(root.querySelectorAll("[style],[fill],[stroke]"), doEl);
  }
  function onMut(list){
    if(!on || busy) return;
    busy = true;
    try{
      list.forEach(function(m){
        if(m.type === "attributes") doEl(m.target);
        else Array.prototype.forEach.call(m.addedNodes, function(n){
          if(n.nodeType !== 1) return;
          if(n.tagName === "STYLE") doSheet(n.sheet);
          else if(n.tagName === "LINK") n.addEventListener("load", function(){ busy = true; doSheet(n.sheet); busy = false; });
          else scan(n);
        });
      });
    } finally { busy = false; }
  }
  function base(){
    var s = doc.getElementById("intra-skin-base");
    if(!s){ s = doc.createElement("style"); s.id = "intra-skin-base"; (doc.head || doc.documentElement).appendChild(s); sheets.add(s.sheet); }
    s.textContent =
      ":root{color-scheme:" + (ctx.pal.dark ? "dark" : "light") + "}" +
      "body,body *:not(code):not(pre):not(kbd):not(samp):not(i):not([class*=icon]):not([class*=mono])" + (meta.keepEl ? ":not(" + meta.keepEl + "):not(" + meta.keepEl + " *)" : "") + "{font-family:" + SKIN_FONT + "!important}" +
      "::selection{background:" + fmt(ctx.pal.acc, .25) + "}" +
      (ctx.pal.dark ? "img:not([src*=svg]){filter:none}" : "") +
      "*{scrollbar-color:" + (ctx.pal.dark ? "#4a5570 transparent" : "#c3c8cf transparent") + "}" +
      (meta.css || "");

    if(!doc.getElementById("intra-skin-font")){

    if(on) revert();

    ctx = {pal:pal, native:meta.native, brand:meta.brand};

    try{
      if(meta.attr) doc.documentElement.setAttribute(meta.attr[0], meta.attr[1]);
      base();
      Array.prototype.forEach.call(doc.styleSheets, doSheet);
      scan(doc.body || doc.documentElement);

    on = true;
    if(!obs){
      obs = new win.MutationObserver(onMut);

    obs.observe(doc.documentElement, {subtree:true, childList:true, attributes:true, attributeFilter:["style","fill","stroke"]});
  }
  function revert(){
    if(!on) return;
    on = false; if(obs) obs.disconnect();
    busy = true;
    try{
      recs.forEach(function(r){ r[1].forEach(function(x){ r[0].setProperty(x[0], x[1], x[3]); }); });
      for(var i=removed.length-1;i>=0;i--){ try{ removed[i][0].insertRule(removed[i][2], removed[i][1]); }catch(e){} }
      inline.forEach(function(el){
        if(origAttr.has(el) && el.getAttribute("style") === lastAttr.get(el)){ el.setAttribute("style", origAttr.get(el)); }
        lastAttr.delete(el);
        ["fill","stroke"].forEach(function(a){ if(el["_sk0_" + a] != null && el.getAttribute(a) === el["_sk_" + a]) el.setAttribute(a, el["_sk0_" + a]); el["_sk_" + a] = null; });
      });
      var b = doc.getElementById("intra-skin-base"); if(b) b.remove();
    } finally { busy = false; }
    recs = []; removed = []; inline = new Set(); sheets = new WeakSet(); lastAttr = new WeakMap();
  }
  // 인쇄 · 이미지 저장 때는 원래 색으로
  var cur = null, hold = 0;
  function pause(){ if(hold++ === 0 && on) revert(); }
  function resume(){ if(--hold <= 0){ hold = 0; if(cur) apply(cur); } }
  win.addEventListener("beforeprint", pause);
  win.addEventListener("afterprint", resume);
  if(typeof win.html2canvas === "function" && !win.html2canvas._sk){
    var h2c = win.html2canvas;
    win.html2canvas = function(){
      pause();
      var p; try{ p = h2c.apply(this, arguments); }catch(e){ resume(); throw e; }
      return Promise.resolve(p).then(function(v){ resume(); return v; }, function(e){ resume(); throw e; });
    };
    win.html2canvas._sk = true;
  }
  return {
    set: function(name){ cur = name; if(hold) return; apply(name); },
    off: function(){ cur = null; revert(); }
  };
}

async function ssoBoot(){

}
async function ensureProfile(m, u){
  var path = master().profiles + "/" + u.uid;
  var pf = null;
  try{ pf = await m.get(path); }catch(e){ throw e; }
  if(pf) return pf;
  var base = {email:u.email, createdAt:Date.now()};
  try{ await m.set(path, Object.assign({name:"", status:"approved", role:"admin"}, base)); }
  catch(e){ await m.set(path, Object.assign({name:u.email.split("@")[0], status:"pending", role:"member"}, base)); }
  return await m.get(path);
}
async function afterMaster(u, pw){
  var m = HP(master().key), pf;
  try{ pf = await ensureProfile(m, u); }
  catch(e){ lgShow("login"); return lgErr("계정 정보를 읽지 못했습니다. " + msgOf(e)); }
  if(pf.status !== "approved") return lgShow(pf.status || "pending");
  SSO.profile = pf; SSO.uid = u.uid;
  if(!pf.name) return lgShow("name");
  var need = others().filter(function(p){ var h = HP(p.key), x = h && h.user(); return h && (!x || x.email !== u.email); });
  if(need.length && !pw) return lgShow("relogin", {need:need});
  var fails = pw ? await provision(need, u.email, pw) : [];
  others().forEach(function(p){ if(!HP(p.key)) fails.push({p:p, e:"timeout"}); });
  if(pf.role === "admin") syncStaff();
  if(fails.length) return lgShow("partial", {fails:fails});
  enter();
}
async function provision(list, email, pw){
  var fails = [];
  await Promise.all(list.map(async function(p){
    var h = HP(p.key);
    try{
      var cur = h.user(); if(cur && cur.email !== email) await h.signOut();
      await h.signIn(email, pw);
    }catch(e){
      if(AUTH_FAIL.indexOf(e.code) < 0) return fails.push({p:p, e:e.code || e.message});
      try{ await h.create(email, pw); }
      catch(e2){ fails.push({p:p, e: e2.code === "auth/email-already-in-use" ? "pw-mismatch" : (e2.code || e2.message)}); }
    }
  }));
  return fails;
}
async function syncStaff(){
  var g = SSO_CFG.projects.filter(function(p){ return p.staffDoc; });

  try{
    var users = await HP(master().key).list(master().profiles);
    var emails = users.filter(function(x){ return x.status === "approved" && x.email; }).map(function(x){ return x.email.toLowerCase(); });
    SSO.pendingCount = users.filter(function(x){ return x.status === "pending"; }).length;
    renderUserChip();
    g.forEach(function(p){ var h = HP(p.key); if(h && h.user()) h.set(p.staffDoc, {emails:emails, updatedAt:Date.now()}).catch(function(){}); });
  }catch(e){}
}

async function userAct(id, act, btn){
  var h = HP(master().key), row = U.rows.filter(function(x){ return x._id === id; })[0];
  if(!h || !row) return;
  var patch = null;
  if(act === "approve"){
    var nm = row.name;
    if(!nm){ nm = prompt("표시할 이름을 입력하세요 (공지 체크·견적서에 그대로 표시됩니다)", (row.email || "").split("@")[0]); if(!nm) return; nm = nm.trim(); }
    patch = {status:"approved", name:nm};
  }
  if(act === "reject"){ if(!confirm((row.name || row.email) + " 님의 가입을 거절할까요?")) return; patch = {status:"rejected"}; }
  if(act === "disable"){ if(!confirm((row.name || row.email) + " 님의 사용을 중지할까요? 다시 승인할 수 있습니다.")) return; patch = {status:"disabled"}; }
  if(act === "admin"){ patch = {role:"admin"}; }
  if(act === "member"){ patch = {role:"member"}; }
  if(act === "rename"){
    var nn = prompt("표시할 이름", row.name || ""); if(nn == null) return; nn = nn.trim(); if(!nn) return;
    patch = {name:nn};
  }
  if(!patch) return;
  btn.disabled = true;
  try{
    await h.set(master().profiles + "/" + id, patch, true);
    Object.assign(row, patch);
    SSO.pendingCount = U.rows.filter(function(x){ return x.status === "pending"; }).length;
    renderUserChip(); renderUsers();
    if(patch.status === "approved" || patch.name) syncStaff();
    toast("저장했습니다");
  }catch(e){
    btn.disabled = false;
    toast("저장하지 못했습니다. " + msgOf(e));
  }
}

    var f3 = b.closest("form"); if(!f3.reportValidity()) return;
    var nm = $("#suName").value.trim(), em2 = $("#suEmail").value.trim().toLowerCase(), p1 = $("#suPw").value;
    if(p1 !== $("#suPw2").value) return lgErr("비밀번호 확인이 일치하지 않습니다.");
    busy(b, true, "신청 중…");
    try{
      var cr = await m.create(em2, p1);
      await m.set(master().profiles + "/" + cr.user.uid, {name:nm, email:em2, status:"pending", role:"member", createdAt:Date.now()});
      SSO.email = em2; lgShow("pending");
    }catch(err){ busy(b, false, "가입 신청"); lgErr(msgOf(err)); }
    return;
  }
  if(s === "name"){
    var f4 = b.closest("form"); if(!f4.reportValidity()) return;
    var nn = $("#myName").value.trim();
    busy(b, true);
    try{
      await m.set(master().profiles + "/" + SSO.uid, {name:nn}, true);
      if(master().members){
        var mem = (await m.get(master().members)) || {}; var list = mem.list || [];
        if(list.indexOf(nn) < 0) await m.set(master().members, {list: list.concat([nn])});
      }
      await afterMaster(m.user(), SSO._pw || null);
    }catch(err){ busy(b, false); lgErr(msgOf(err)); }
    return;
  }
  if(s === "retry"){
    var i = +b.dataset.i, fl = LG.fails[i], pw2 = $("#fp" + i).value;
    if(!pw2) return;
    busy(b, true, "…");
    try{ await HP(fl.p.key).signIn(SSO.email, pw2); LG.fails.splice(i, 1); }
    catch(err){ fl.e = err.code || err.message; }
    if(!LG.fails.length) return enter();
    lgShow("partial");
  }
});


renderTop(); renderHome();
ssoBoot();
})();
</script>
