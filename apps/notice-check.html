<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공지 체크보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#f6f7f9; --side:#fbfbfc; --panel:#ffffff; --panel2:#f7f8fa; --line:#eceef2; --line2:#dfe2e8;
  --text:#14161b; --muted:#6b717f; --faint:#a4a9b4;
  --accent:#3b5bdb; --accent-soft:#eef2ff; --accent-ink:#ffffff;
  --ok:#2f9e6b; --ok-soft:#e9f7f0; --warn:#d9822b; --warn-soft:#fdf3e8; --bad:#e03e3e; --bad-soft:#fdeeee;
  --c1:#3b5bdb; --c2:#8b5cf6; --c3:#0e9f8c; --c4:#d9822b; --c5:#8a909c;
  --shadow-s:0 1px 2px rgba(16,24,40,.04);
  --shadow-l:0 20px 50px rgba(16,24,40,.16);
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --serif:var(--sans);
}
:root[data-theme="dark"]{
  --bg:#0f1013; --side:#121317; --panel:#17181c; --panel2:#1c1e23; --line:#25272d; --line2:#30333a;
  --text:#ecedf0; --muted:#9398a3; --faint:#5d626c;
  --accent:#7c93f5; --accent-soft:#1d2238; --accent-ink:#0f1013;
  --ok:#4cc38a; --ok-soft:#15261e; --warn:#f0a150; --warn-soft:#2a2016; --bad:#f06a6a; --bad-soft:#2c1819;
  --c1:#7c93f5; --c2:#a78bfa; --c3:#3cc7b2; --c4:#f0a150; --c5:#9398a3;
  --shadow-s:none; --shadow-l:0 20px 50px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--accent);text-underline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 14px;overflow:auto}
.brand{padding:2px 8px 16px}
.brand .mark{font-size:15px;font-weight:700;letter-spacing:-.02em}
.brand .mark i{font-style:normal;color:var(--accent)}
.brand .sub{font-size:11px;color:var(--faint);margin-top:1px}
.mebox{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px;margin-bottom:16px}
.mebox label{font-size:10.5px;color:var(--faint);display:block;margin-bottom:4px}
.mebox .row{display:flex;align-items:center;gap:8px}
.mebox select{flex:1;min-width:0;background:transparent;border:0;font-weight:600;font-size:13px;padding:0;outline:none}
.nav-t{font-size:10.5px;color:var(--faint);margin:4px 8px 4px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:1px;margin-bottom:14px}
.nav button{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;text-align:left;color:var(--muted);font-weight:500;font-size:13px}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .ic{width:14px;text-align:center;font-size:12px;opacity:.75}
.nav .ct{margin-left:auto;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.nav button.on .ct{color:var(--accent)}
.nav .ct.hot{background:var(--bad);color:#fff;border-radius:99px;padding:0 6px;line-height:16px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.side-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.status{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;padding:0 6px}
.status .dot{background:var(--faint);width:6px;height:6px}
.status.live .dot{background:var(--ok)}
.status.err{color:var(--bad)} .status.err .dot{background:var(--bad)}
.banner.err{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.banner.err ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.banner .codes{margin-top:6px;font-size:11px;color:var(--muted);font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.side-foot .btns{display:flex;gap:2px;flex-wrap:wrap}

.main{min-width:0;padding:24px 32px 60px;max-width:1120px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-weight:700;font-size:19px;letter-spacing:-.03em;margin:0;line-height:1.3}
.head .date{color:var(--faint);font-size:12px;margin-top:1px}
.head .sp{flex:1}

.btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);background:var(--panel);padding:6px 12px;border-radius:7px;font-weight:600;font-size:12.5px;transition:.12s;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ok:hover{background:var(--ok);filter:brightness(1.05)}
.btn.on-r{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.on-d{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--text);background:var(--panel2)}
.btn.danger{color:var(--bad)}
.field{background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:6px 10px;outline:none;transition:.12s;font-size:12.5px}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search{position:relative;min-width:200px}
.search input{width:100%;padding-left:28px}
.search::before{content:"";position:absolute;left:10px;top:50%;width:9px;height:9px;border:1.5px solid var(--faint);border-radius:50%;transform:translateY(-62%)}
.search::after{content:"";position:absolute;left:18px;top:58%;width:4px;height:1.5px;background:var(--faint);transform:rotate(45deg)}

.band{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.band button{padding:11px 14px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;transition:.12s;box-shadow:var(--shadow-s)}
.band button:hover{border-color:var(--line2)}
.band .k{font-size:11.5px;color:var(--muted);font-weight:500}
.band .v{font-size:20px;font-weight:700;line-height:1.3;margin-top:2px;letter-spacing:-.02em}
.band .v small{font-size:11px;color:var(--faint);font-weight:500;margin-left:2px}
.band .warn .v{color:var(--warn)} .band .bad .v{color:var(--bad)}

.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:4px 10px;border-radius:6px;font-size:12px;font-weight:500;color:var(--muted)}
.chip:hover{color:var(--text);background:var(--panel)}
.chip.on{background:var(--text);color:var(--bg);font-weight:600}

.day{margin-bottom:22px}
.day-h{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px}
.day-h h3{font-size:13px;font-weight:700;margin:0}
.day-h .rel{font-size:10.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:0 6px;border-radius:4px}
.day-h .cnt{color:var(--faint);font-size:11.5px;margin-left:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-s);overflow:hidden}
.row{display:grid;grid-template-columns:1fr 250px;gap:18px;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;position:relative;transition:background .12s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--panel2)}
.row.unread::before,.row.over::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:0 2px 2px 0;background:var(--accent)}
.row.over::before{background:var(--bad)}
.cat{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--cc)}
.cat .dot{background:var(--cc);width:6px;height:6px}

.tt{font-size:13.5px;font-weight:600;margin:2px 0 3px;line-height:1.45}
.flag{display:inline-block;font-size:10px;font-weight:600;padding:0 5px;line-height:17px;border-radius:4px;margin-right:5px;vertical-align:1px}
.flag.imp{background:var(--bad-soft);color:var(--bad)}
.flag.act{background:var(--warn-soft);color:var(--warn)}
.flag.mine{background:var(--accent-soft);color:var(--accent)}
.flag.need{background:var(--warn-soft);color:var(--warn)}
.flag.done{background:var(--ok-soft);color:var(--ok)}
.meta{display:flex;flex-wrap:wrap;gap:2px 10px;color:var(--faint);font-size:11.5px}
.meta .edited{color:var(--warn)}
.due.over{color:var(--bad);font-weight:600} .due.soon{color:var(--warn);font-weight:600}
.snip{color:var(--muted);font-size:12px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

.chk{display:flex;flex-direction:column;gap:4px;justify-content:center;border-left:1px solid var(--line);padding-left:16px}
.avs{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:1px}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:9px;font-weight:600;letter-spacing:-.04em;background:var(--panel2);color:var(--faint);border:1px solid var(--line2);flex:none}
.av.n{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.av.r{background:var(--panel);color:var(--accent);border:1px solid var(--accent)}
.av.a{background:var(--accent);color:#fff;border-color:transparent}
.av.d{background:var(--ok);color:#fff;border-color:transparent}
.av.me{box-shadow:0 0 0 1px var(--panel),0 0 0 2px var(--accent)}
.who-line{font-size:11.5px;display:flex;gap:6px;align-items:baseline;line-height:1.4}
.who-line b{font-weight:600;white-space:nowrap}
.who-line span{color:var(--muted)}
.who-line.no b{color:var(--bad)} .who-line.mid b{color:var(--accent)} .who-line.ok b{color:var(--ok)} .who-line.pend b{color:var(--warn)}
.empty{text-align:center;color:var(--muted);padding:56px 0;font-size:12.5px}
.empty .serif{font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px}

.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:16px}
.tm{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tm .nm{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;margin-bottom:6px}
.tm .kv{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:1px 0}
.tm .kv b{font-variant-numeric:tabular-nums;color:var(--text);font-weight:600}
.tm .kv b.w{color:var(--warn)} .tm .kv b.xx{color:var(--bad)}
.tbl-wrap{overflow:auto}
table.mx{width:100%;border-collapse:collapse}
.mx th,.mx td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;font-size:12px;white-space:nowrap}
.mx th{font-size:11px;color:var(--muted);font-weight:600;background:var(--panel2)}
.mx tr:last-child td{border-bottom:0}
.mx .l{text-align:left}
.mx td.t{cursor:pointer;font-weight:500;white-space:normal;min-width:200px}
.mx td.t:hover{color:var(--accent)}
.mk{font-weight:600;font-size:11px;padding:1px 6px;border-radius:4px}
.mk.no{color:var(--bad);background:var(--bad-soft)} .mk.r{color:var(--accent);background:var(--accent-soft)} .mk.d{color:var(--ok);background:var(--ok-soft)}
.note{color:var(--faint);font-size:11.5px;margin-top:8px}

.lg{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.lg:last-child{border-bottom:0}
.lg .tm2{font-variant-numeric:tabular-nums;color:var(--faint);font-size:11.5px;padding-top:3px}
.lg .top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lg .by{font-weight:600}
.act{font-size:10.5px;font-weight:600;padding:0 6px;line-height:17px;border-radius:4px;background:var(--panel2);color:var(--muted)}
.act.create{color:var(--c3);background:color-mix(in srgb,var(--c3) 12%,transparent)}
.act.edit{color:var(--warn);background:var(--warn-soft)}
.act.delete{color:var(--bad);background:var(--bad-soft)}
.act.read{color:var(--muted);background:var(--panel2)}
.act.ack{color:var(--accent);background:var(--accent-soft)}
.act.setting{color:var(--text);background:var(--panel2)}
.act.done{color:var(--ok);background:var(--ok-soft)}
.act.comment{color:var(--c2);background:color-mix(in srgb,var(--c2) 12%,transparent)}
.lg .ref{font-weight:500;cursor:pointer}
.lg .ref:hover{text-decoration:underline}
.lg .ref.gone{cursor:default;text-decoration:line-through;color:var(--faint)}
.chg{margin-top:6px;display:flex;flex-direction:column;gap:3px;font-size:12px}
.chg .f{color:var(--muted);display:inline-block;min-width:56px;font-weight:500}
.chg del{color:var(--bad);text-decoration:line-through}
.chg ins{color:var(--ok);text-decoration:none;font-weight:600}
.diff{margin-top:2px;border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:11.5px;line-height:1.6}
.diff div{padding:1px 10px;white-space:pre-wrap;word-break:break-word}
.diff .a{background:var(--ok-soft);color:var(--ok)}
.diff .a::before{content:"+ ";opacity:.6}
.diff .d{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.diff .d::before{content:"− ";opacity:.6}
.diff .s{color:var(--faint)}
.quote{margin-top:4px;padding:4px 10px;border-left:2px solid var(--line2);color:var(--muted);font-size:12px;white-space:pre-wrap}

.scrim{position:fixed;inset:0;background:rgba(16,18,24,.28);opacity:0;pointer-events:none;transition:.18s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(max(480px,50vw),100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow-l);transform:translateX(102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);z-index:45;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-h{padding:16px 20px 14px;border-bottom:1px solid var(--line)}
.dr-h .top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.dr-h h2{font-size:16px;font-weight:700;line-height:1.4;margin:0 0 6px;letter-spacing:-.02em}
.x{width:26px;height:26px;border-radius:6px;font-size:17px;line-height:1;color:var(--faint);margin-left:auto}
.x:hover{background:var(--panel2);color:var(--text)}
.mybar{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.dr-b{padding:16px 20px;overflow:auto;flex:1}
.dr-f{padding:10px 20px;border-top:1px solid var(--line);display:flex;gap:6px}
.body{white-space:pre-wrap;word-break:break-word;line-height:1.75;font-size:13px}
/* 첨부 */
.att{display:flex;flex-direction:column;gap:6px}
.att-h{font-size:12px;color:var(--muted);font-weight:600}
.att-h small{font-weight:400;color:var(--faint);margin-left:4px}
.att-list{display:flex;flex-direction:column;gap:4px}
.att-it,.frow{display:flex;align-items:center;gap:8px;font-size:12.5px;min-width:0}
.att-it{padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel2)}
.att-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-it small,.frow small{color:var(--faint);white-space:nowrap}
.att-empty{font-size:12px;color:var(--faint)}
.att-add{align-self:flex-start;cursor:pointer}
.att-k{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:5px;white-space:nowrap;background:var(--panel2);color:var(--muted)}
.att-k.img{background:#eef2ff;color:#3b5bdb}.att-k.xls{background:#e9f7f0;color:#2f9e6b}.att-k.pdf{background:#fdeeee;color:#e03e3e}
.files{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.file{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel)}
.thumb{margin-bottom:8px;border-radius:6px;overflow:hidden;background:var(--panel2);min-height:60px;display:grid;place-items:center;color:var(--faint);font-size:12px}
.thumb img{display:block;max-width:100%;max-height:520px;object-fit:contain;cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:90;background:rgba(8,10,16,.82);display:none;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px 24px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:calc(100vh - 110px);object-fit:contain;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.45);background:#fff}
.lb-bar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:10px 14px;color:#e8ecf5;font-size:13px}
.lb-bar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-bar button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:7px;padding:5px 10px;font-size:12.5px;cursor:pointer}
.lb-bar button:hover{background:rgba(255,255,255,.22)}
.links{margin-top:10px;display:flex;flex-direction:column;gap:3px;font-size:12px;padding:8px 10px;background:var(--panel2);border-radius:6px}
.sec{margin-top:20px}
.sec-t{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:8px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.split.three{grid-template-columns:repeat(3,1fr)}
.box{background:var(--panel2);border-radius:8px;padding:9px 11px}
.box h4{margin:0 0 6px;font-size:11.5px;font-weight:600;display:flex;justify-content:space-between}
.box.ok h4{color:var(--ok)} .box.no h4{color:var(--bad)} .box.r h4{color:var(--warn)} .box.a h4{color:var(--accent)} .box.p h4{color:var(--warn)}
.box ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.box li{display:flex;align-items:center;gap:6px;font-size:12px}
.box li small{margin-left:auto;color:var(--faint);font-size:10.5px;font-variant-numeric:tabular-nums}
.box .none{color:var(--faint);font-size:11.5px}
.cm{padding:7px 0;border-bottom:1px solid var(--line)}
.cm:last-of-type{border-bottom:0}
.cm .h{display:flex;gap:6px;align-items:center;font-size:12px}
.cm .h small{color:var(--faint);font-size:11px}
.cm p{margin:2px 0 0 28px;white-space:pre-wrap;font-size:12.5px}
.cm-in{display:flex;gap:6px;margin-top:8px}
.cm-in input{flex:1}
.tl{position:relative;padding-left:14px}
.tl::before{content:"";position:absolute;left:3px;top:6px;bottom:6px;width:1px;background:var(--line2)}
.tl .ev{position:relative;padding:2px 0 9px}
.tl .ev::before{content:"";position:absolute;left:-14px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--line2)}
.tl .ev.create::before{background:var(--c3)} .tl .ev.edit::before{background:var(--warn)}
.tl .ev.done::before{background:var(--ok)} .tl .ev.read::before{background:var(--line2)} .tl .ev.ack::before{background:var(--accent)} .tl .ev.setting::before{background:var(--c5)} .tl .ev.comment::before{background:var(--c2)}
.tl .ev .h{font-size:12px}
.tl .ev .h small{color:var(--faint);margin-left:4px;font-size:11px;font-variant-numeric:tabular-nums}

.modal-wrap{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;padding:8vh 16px;z-index:60;overflow:auto;background:rgba(16,18,24,.32)}
.modal-wrap.on{display:flex}

  .app{grid-template-columns:1fr}

<script>
/* =========================================================
   1) Firebase 설정 — Firebase 콘솔 > 프로젝트 설정 > 웹 앱 값을 붙여넣으세요.
      apiKey가 비어 있으면 '체험 모드'(이 브라우저에만 저장)로 동작합니다.
   ========================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCQix_uMdvMdGKvo3ZSe7KgIoD7HJEXp0g",
  authDomain: "noticecheck-80980.firebaseapp.com",
  projectId: "noticecheck-80980",
  storageBucket: "noticecheck-80980.firebasestorage.app",
  messagingSenderId: "251674052066",
  appId: "1:251674052066:web:9edd72d52728a1486425bb"
};
const OWNER_EMAILS = ["t9vely@naver.com", "t9vely@gmail.com"];   // Firestore 규칙의 isOwner 목록과 같게
const P = "noticeboard";   // 컬렉션: noticeboard_notices / noticeboard_meta / noticeboard_log
const LOG_LIMIT = 2000;    // 불러올 최근 이력 수

const PALETTE = ["#3b5bdb","#8b5cf6","#0e9f8c","#d9822b","#e03e3e","#0284c7","#db2777","#65a30d","#8a909c"];
const DEFAULT_CATS = [
  {id:"c1",name:"공지사항",color:"#3b5bdb"},{id:"c2",name:"학사공지",color:"#8b5cf6"},
  {id:"c3",name:"교육공지",color:"#0e9f8c"},{id:"c4",name:"자료정보",color:"#d9822b"},{id:"c5",name:"기타",color:"#8a909c"}];
const catList = () => (Store.settings.cats && Store.settings.cats.length ? Store.settings.cats : DEFAULT_CATS);
const CATS = () => catList().map(c=>c.name);
const catColor = name => (catList().find(c=>c.name===name) || {}).color || "#8a909c";
const cs = name => `style="--cc:${esc(catColor(name))}"`;
// 설정에 없는 분류를 쓰는 공지가 있으면 메뉴에도 보이게
const navCats = () => { const L = CATS(); Store.notices.forEach(n => { if(n.cat && !L.includes(n.cat)) L.push(n.cat); }); return L; };
const DEMO_FILES = {};   // 체험 모드에서만 쓰는 첨부 보관소
const FIELDS = {cat:"분류",date:"게시일",title:"제목",body:"내용",links:"링크",important:"중요",needAction:"처리 필요",due:"처리 기한"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,"0");
const ymd = ms => { const d=new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const hm = ms => { const d=new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const mdhm = ms => { const d=new Date(ms); return `${d.getMonth()+1}/${d.getDate()} ${hm(ms)}`; };
const stamp = v => typeof v === "number" ? mdhm(v) : (v || "");
const today = () => ymd(Date.now());
const WD = ["일","월","화","수","목","금","토"];
const initials = n => { n = String(n||"?"); return n.length >= 3 ? n.slice(-2) : n; };
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
const FBC = FIREBASE_CONFIG.apiKey ? FIREBASE_CONFIG : (LS.get("nb_fbconfig", null) || FIREBASE_CONFIG);
const FBC_FROM_BROWSER = !FIREBASE_CONFIG.apiKey && !!FBC.apiKey;
const clip = (s,n=5000) => { s = String(s ?? ""); return s.length > n ? s.slice(0,n) : s; };

/* =========================================================
   2) 저장소 — Firestore(실시간) / 체험 모드(localStorage)
   ========================================================= */
const Store = (() => {
  let notices = [], members = [], logs = [], settings = {}, listeners = [];
  const emit = () => listeners.forEach(f => f());
  let db = null;
  const col = n => db.collection(P + "_" + n);

  let unsubs = [];
  function subscribe(){
    const onErr = what => e => { console.error(what, e); api.diag.errors[what] = e.code || e.message; emit(); };
    const ok = what => { delete api.diag.errors[what]; api.diag.loaded = true; };
    unsubs = [
      col("notices").onSnapshot(s => { notices = s.docs.map(d => ({id:d.id, ...d.data()})); ok("공지"); emit(); }, onErr("공지")),
      col("meta").doc("members").onSnapshot(d => { members = (d.exists && d.data().list) || []; ok("팀원"); emit(); }, onErr("팀원")),
      col("meta").doc("settings").onSnapshot(d => { settings = (d.exists && d.data()) || {}; ok("설정"); emit(); }, onErr("설정")),
      col("log").orderBy("at","desc").limit(LOG_LIMIT).onSnapshot(s => { logs = s.docs.map(d => ({id:d.id, ...d.data()})); ok("변경 이력"); emit(); }, onErr("변경 이력"))
    ];
  }
  function unsubscribe(){ unsubs.forEach(f => { try{ f(); }catch(e){} }); unsubs = []; notices = []; members = []; logs = []; settings = {}; api.diag.errors = {}; api.diag.loaded = false; }

  async function initLive(){
    firebase.initializeApp(FBC);
    db = firebase.firestore();
    // 이메일/비밀번호 로그인: 로그인 상태가 바뀔 때마다 구독을 켜고 끔
    let profUnsub = null, usersUnsub = null;
    firebase.auth().onAuthStateChanged(user => {
      api.user = user ? {uid:user.uid, email:user.email||""} : null;
      api.authReady = true;
      api.profile = null; api.profileState = user ? "loading" : ""; api._promoteTried = false;
      unsubscribe();
      if(profUnsub){ profUnsub(); profUnsub = null; }
      if(usersUnsub){ usersUnsub(); usersUnsub = null; api.users = []; }
      if(user){
        // 내 가입 정보(noticeboard_users/{uid})를 실시간으로 지켜보다가 승인되면 데이터 구독 시작
        profUnsub = col("users").doc(user.uid).onSnapshot(async d => {
          if(!d.exists){
            api.profile = null;
            if(api.signingUp) return;                // 가입 신청 중에는 신청서가 곧 써짐
            api.profileState = "creating"; emit();
            await ensureProfile(user);
            return;
          }
          // 아직 서버에 반영되지 않은 임시 값은 무시 (권한 판단이 잠깐 틀어지는 것을 막음)
          if(d.metadata && d.metadata.hasPendingWrites) return;
          const pf = d.data();
          // 최고 관리자 이메일만 대기/거절 상태여도 스스로 관리자로 전환 (일반 계정은 시도하지 않음)
          const isOwnerMail = OWNER_EMAILS.indexOf(String(user.email || "").toLowerCase()) >= 0;
          if(isOwnerMail && (pf.status !== "approved" || pf.role !== "admin")){
            if(!api._promoteTried){
              api._promoteTried = true;
              try{ await col("users").doc(user.uid).update({status:"approved", role:"admin"}); return; }
              catch(e){ /* 일반 계정은 여기로 옴 */ }
            }
          }
          api.profile = pf;
          api.profileState = pf.status || "pending";
          if(pf.status === "approved"){
            if(!unsubs.length) subscribe();
            if(pf.role === "admin" && !usersUnsub){
              usersUnsub = col("users").onSnapshot(s => { api.users = s.docs.map(x => ({uid:x.id, ...x.data()})); emit(); },
                e => { api.diag.errors["가입자 목록"] = e.code || e.message; emit(); });
            }
            if(pf.role !== "admin" && usersUnsub){ usersUnsub(); usersUnsub = null; api.users = []; }
            if(pf.role !== "admin"){ delete api.diag.errors["가입자 목록"]; }
          } else {
            unsubscribe();
            if(usersUnsub){ usersUnsub(); usersUnsub = null; api.users = []; }
            delete api.diag.errors["가입자 목록"];
          }
          emit();
        }, e => { api.profileState = "error"; api.diag.errors["내 계정"] = e.code || e.message; emit(); });
      }
      emit();
    });
  }
  // 콘솔에서 직접 만든 계정처럼 가입 정보가 없는 경우: 관리자 이메일이면 관리자로, 아니면 승인 대기로 등록
  async function ensureProfile(user){
    const ref = col("users").doc(user.uid), base = {email:user.email||"", createdAt:Date.now()};
    try{ await ref.set({...base, name:"", status:"approved", role:"admin"}); }
    catch(e){
      try{ await ref.set({...base, name:(user.email||"").split("@")[0], status:"pending", role:"member"}); }
      catch(e2){ api.profileState = "error"; api.diag.errors["내 계정"] = e2.code || e2.message; emit(); }
    }
  }

  function seed(){
    const now = Date.now(), H = 3600e3, D = 24*H, t = today();
    const dd = n => ymd(now + n*D);
    members = ["김태욱","이서연","박준호"];
    const a = {id:uid(),cat:"학사공지",date:t,title:"10월 개강반 시간표 확정 안내",body:"10월 개강반 시간표가 확정되었습니다.\n상담 시 변경된 시간표로 안내 부탁드립니다.\n토요반은 오전 10시 시작입니다.",links:"",important:true,needAction:true,due:dd(2),author:"김태욱",read:{"김태욱":now-3*H,"이서연":now-2*H,"박준호":now-H/2},ack:{"김태욱":now-3*H,"이서연":now-2*H+60e3},done:{"이서연":now-H},comments:[],createdAt:now-3*H,updatedAt:now-H*1.5,updatedBy:"김태욱"};
    const b = {id:uid(),cat:"교육공지",date:t,title:"신규 멘토 온보딩 교육 (금 10시, 3층 세미나실)",body:"금요일 오전 10시 3층 세미나실에서 진행합니다.",links:"",important:false,needAction:false,due:"",author:"이서연",read:{"이서연":now-2*H},ack:{"이서연":now-2*H},done:{},comments:[],createdAt:now-2*H};
    const c = {id:uid(),cat:"자료정보",date:dd(-1),title:"국민내일배움카드 개편 요약 자료",body:"상담 시 참고하세요.",links:"https://www.hrd.go.kr",important:false,needAction:false,due:"",author:"박준호",read:{"김태욱":now-D+H,"이서연":now-D+2*H,"박준호":now-D},ack:{"이서연":now-D+2*H,"박준호":now-D},done:{},comments:[{by:"이서연",at:now-D+2*H,text:"상담 스크립트에 반영했습니다."}],createdAt:now-D};

    },
    async updateNotice(id, data, by){
      const prev = notices.find(x=>x.id===id);
      const changes = Object.keys(FIELDS)
        .filter(k => String(prev[k] ?? "") !== String(data[k] ?? ""))
        .map(k => ({f:k, from:clip(prev[k]), to:clip(data[k])}));
      const fl = a => (a||[]).map(x=>x.name).join(", ");
      if(data.files && fl(prev.files) !== fl(data.files)) changes.push({f:"첨부", from:clip(fl(prev.files)||"(없음)"), to:clip(fl(data.files)||"(없음)")});
      if(!changes.length) return 0;
      const upd = {...data, updatedAt:Date.now(), updatedBy:by||""};
      if(api.live) await col("notices").doc(id).update(upd);
      else Object.assign(prev, upd);
      await writeLog(logOf("edit", {...prev, ...data, id}, by, {changes}));
      if(!api.live){ saveDemo(); emit(); }
      return changes.length;
    },
    /* 첨부 파일: Firestore에 조각(700KB)으로 나눠 저장 — 별도 Storage 요금제 없이 동작 */
    async uploadFile(file, by, onProgress){
      const b64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(String(r.result).split(",")[1] || "");
        r.onerror = () => rej(r.error || new Error("파일을 읽지 못했습니다"));
        r.readAsDataURL(file);
      });
      const CH = 700000, parts = Math.max(1, Math.ceil(b64.length / CH));
      const meta = {name:file.name, type:file.type||"", size:file.size, parts, by:by||"", at:Date.now()};
      if(api.live){
        const ref = col("files").doc();
        await ref.set(meta);
        for(let i=0;i<parts;i++){
          await ref.collection("parts").doc(String(i)).set({d: b64.slice(i*CH, (i+1)*CH)});
          if(onProgress) onProgress(i+1, parts);
        }
        return {id:ref.id, name:meta.name, type:meta.type, size:meta.size};
      }
      const id = uid(); DEMO_FILES[id] = b64;
      return {id, name:meta.name, type:meta.type, size:meta.size};
    },
    async fileBlob(f){
      let b64 = "";
      if(api.live){
        const s = await col("files").doc(f.id).collection("parts").get();
        b64 = s.docs.map(d => [+d.id, d.data().d || ""]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join("");
      } else b64 = DEMO_FILES[f.id] || "";
      const bin = atob(b64), u8 = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
      return new Blob([u8], {type: f.type || "application/octet-stream"});
    },
    async deleteFile(id){
      if(!api.live){ delete DEMO_FILES[id]; return; }
      try{
        const ref = col("files").doc(id), s = await ref.collection("parts").get();
        await Promise.all(s.docs.map(d => d.ref.delete()));
        await ref.delete();
      }catch(e){ console.warn("첨부 삭제 실패", e); }
    },
    async deleteNotice(id, by){
      const n = notices.find(x=>x.id===id);
      (n && n.files || []).forEach(f => api.deleteFile(f.id));
      if(api.live) await col("notices").doc(id).delete();
      else notices = notices.filter(x=>x.id!==id);
      await writeLog(logOf("delete", n, by, {snapshot:{body:clip(n.body,2000), date:n.date}}));
      if(!api.live){ saveDemo(); emit(); }
    },
    // 체크는 본인 칸만 갱신 → 동시 체크가 서로 덮어쓰지 않음
    async setMark(id, kind, name, on){
      const n = notices.find(x=>x.id===id);
      if(api.live){
        const V = firebase.firestore.FieldValue;
        await col("notices").doc(id).update(new firebase.firestore.FieldPath(kind,name), on ? Date.now() : V.delete());
      } else {
        n[kind] = n[kind] || {};
        if(on) n[kind][name] = Date.now(); else delete n[kind][name];
      }
      await writeLog(logOf(on ? kind : "undo", n, name, on ? null : {what:kind}));
      if(!api.live){ saveDemo(); emit(); }
    },
    async addComment(id, text, by){
      const n = notices.find(x=>x.id===id);
      const c = {by, at:Date.now(), text, k:uid()};
      if(api.live) await col("notices").doc(id).update({comments: firebase.firestore.FieldValue.arrayUnion(c)});
      else (n.comments = n.comments || []).push(c);
      await writeLog(logOf("comment", n, by, {text:clip(text,500)}));
      if(!api.live){ saveDemo(); emit(); }
    },
    async setMembers(list, by, note){
      if(api.live) await col("meta").doc("members").set({list});
      else members = list;
      if(api.live) members = list;
      if(note) await writeLog({at:Date.now(), by:by||"", account:(api.user&&api.user.email)||"", type:"member", noticeId:"", title:note, cat:""});
      if(!api.live){ saveDemo(); emit(); }
    }
  };
  return api;
})();

const S = { get me(){ return (Store.live && Store.profile && Store.profile.status==="approved") ? (Store.profile.name||"") : this._me; }, set me(v){ this._me = v; }, _me:"", view:"list", cat:"전체", q:"", state:"all", month:"", logType:"content", openId:null, };
S.me = LS.get("nb_me","");
const isAdmin = () => Store.live && Store.profile && Store.profile.status==="approved" && Store.profile.role==="admin";
const M = () => Store.members;
const isRead = (n,m) => !!(n.read && n.read[m]);
const isDone = (n,m) => !!(n.done && n.done[m]);
const myUnread = n => S.me && !isRead(n,S.me);
const isAck = (n,m) => !!(n.ack && n.ack[m]);
const myUnack = n => S.me && !isAck(n,S.me);
const myTodo = n => S.me && n.needAction && !isDone(n,S.me);
function dueState(n){
  if(!n.needAction || !n.due) return "";
  if(M().length && M().every(m=>isDone(n,m))) return "";
  const diff = (new Date(n.due+"T00:00:00") - new Date(today()+"T00:00:00"))/86400000;
  return diff < 0 ? "over" : diff <= 2 ? "soon" : "";
}
function weekStart(){ const d=new Date(); d.setDate(d.getDate()-((d.getDay()+6)%7)); return ymd(d.getTime()); }
function dayTitle(d){
  const x = new Date(d+"T00:00:00");
  return `${x.getMonth()+1}월 ${x.getDate()}일 ${WD[x.getDay()]}요일`;
}
function dayRel(d){
  const diff = Math.round((new Date(today()+"T00:00:00") - new Date(d+"T00:00:00"))/86400000);
  return diff===0 ? "오늘" : diff===1 ? "어제" : "";
}
function nameList(arr){ return arr.length > 4 ? arr.slice(0,4).join(", ") + ` 외 ${arr.length-4}명` : arr.join(", "); }

function filteredNotices(ignoreCat){
  const q = S.q.trim().toLowerCase();
  return Store.notices.filter(n => {
    if(!ignoreCat && S.cat!=="전체" && n.cat!==S.cat) return false;
    if(S.month && !(n.date||"").startsWith(S.month)) return false;
    if(q && !((n.title||"")+" "+(n.body||"")).toLowerCase().includes(q)) return false;
    switch(S.state){
      case "unread": return myUnread(n);
      case "todo": return myTodo(n);
      case "unack": return myUnack(n);
      case "nack": return M().some(m=>!isAck(n,m));
      case "open": return n.needAction && M().some(m=>!isDone(n,m));
      case "miss": return M().some(m=>!isRead(n,m));
      case "over": return dueState(n)==="over";
      case "imp": return !!n.important;
      case "week": return (n.date||"") >= weekStart();
    }
    return true;
  }).sort((a,b)=> (b.date||"").localeCompare(a.date||"") || (b.createdAt||0)-(a.createdAt||0));
}
const LOG_TYPES = {
  content:{label:"등록·수정·삭제", types:["create","edit","delete"]},
  check:{label:"확인·체크·처리", types:["read","ack","done","undo"]},
  setting:{label:"설정·팀원", types:["setting","member"]},
  comment:{label:"댓글", types:["comment"]},
  all:{label:"전체 활동", types:null}
};
function filteredLogs(){
  const q = S.q.trim().toLowerCase(), T = LOG_TYPES[S.logType].types;
  return Store.logs.filter(l => {
    if(T && !T.includes(l.type)) return false;
    if(S.cat!=="전체" && l.cat!==S.cat) return false;
    if(S.month && !ymd(l.at).startsWith(S.month)) return false;
    if(q && !((l.title||"")+" "+(l.by||"")+" "+(l.text||"")).toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>b.at-a.at);
}

async function userAction(act, uidv){
  const u = Store.users.find(x=>x.uid===uidv); if(!u) return;
  const who = u.name || u.email;
  try{
    if(act==="approve"){
      if(!u.name){ const nm = prompt("체크 현황에 표시할 이름을 입력하세요", (u.email||"").split("@")[0]); if(!nm) return; u.name = nm.trim(); await Store.updateUser(u, {status:"approved", name:u.name}, S.me, `가입 승인: ${u.name}`); }
      else {
        if(Store.users.some(x=>x.uid!==u.uid && x.status==="approved" && x.name===u.name)){
          const nm = prompt(`'${u.name}' 이름이 이미 있습니다. 구분할 이름을 입력하세요`, u.name + "2"); if(!nm) return;
          await Store.updateUser(u, {status:"approved", name:nm.trim()}, S.me, `가입 승인: ${nm.trim()}`);
        } else await Store.updateUser(u, {status:"approved"}, S.me, `가입 승인: ${who}`);
      }
      toast(`${who} 님을 승인했습니다`);
    }
    if(act==="reject"){ if(!confirm(`${who} 님의 가입 신청을 거절할까요?`)) return; await Store.updateUser(u, {status:"rejected"}, S.me, `가입 거절: ${who}`); toast("거절했습니다"); }
    if(act==="disable"){ if(!confirm(`${who} 님의 이용을 중지할까요? 팀원 목록에서도 빠집니다.`)) return; await Store.updateUser(u, {status:"disabled", role:"member"}, S.me, `이용 중지: ${who}`); toast("이용을 중지했습니다"); }
    if(act==="admin"){ await Store.updateUser(u, {role:"admin"}, S.me, `관리자 지정: ${who}`); toast("관리자로 지정했습니다"); }
    if(act==="unadmin"){ await Store.updateUser(u, {role:"member"}, S.me, `관리자 해제: ${who}`); toast("관리자에서 해제했습니다"); }
    if(act==="rename"){
      const nm = (prompt("새 이름", u.name||"")||"").trim(); if(!nm || nm===u.name) return;
      if(Store.users.some(x=>x.uid!==u.uid && x.name===nm)) return toast("이미 있는 이름입니다");
      await Store.updateUser(u, {name:nm}, S.me, `이름 변경: ${u.name||"(없음)"} → ${nm}`); toast("이름을 바꿨습니다");
    }
    if(act==="remove"){ if(!confirm(`${who} 님의 가입 기록을 삭제할까요? 같은 계정으로 로그인하면 다시 승인 대기로 등록됩니다.`)) return; await Store.deleteUserDoc(u, S.me); toast("삭제했습니다"); }
  }catch(e){ fail(e); }
}

function avCls(n,m){ return n.needAction && isDone(n,m) ? "d" : isAck(n,m) ? "a" : isRead(n,m) ? "r" : ""; }
function checkBlock(n){
  const mem = M();
  if(!mem.length) return `<div class="chk"><span class="who-line"><span>팀원을 추가하면 체크 현황이 보입니다</span></span></div>`;
  const unread = mem.filter(m=>!isRead(n,m));
  const seenOnly = mem.filter(m=>isRead(n,m) && !isAck(n,m));
  const acked = mem.filter(m=>isAck(n,m));
  const notDone = mem.filter(m=>!isDone(n,m));
  let lines = "";
  if(!unread.length && !seenOnly.length) lines += `<div class="who-line ok"><b>전원 체크</b><span>${acked.length}명</span></div>`;
  else {
    if(unread.length) lines += `<div class="who-line no"><b>미확인 ${unread.length}</b><span>${esc(nameList(unread))}</span></div>`;
    if(seenOnly.length) lines += `<div class="who-line pend"><b>확인만 ${seenOnly.length}</b><span>${esc(nameList(seenOnly))}</span></div>`;
    if(acked.length) lines += `<div class="who-line mid"><b>체크 ${acked.length}</b><span>${esc(nameList(acked))}</span></div>`;
  }
  if(n.needAction){
    lines += notDone.length
      ? `<div class="who-line no"><b>미처리 ${notDone.length}</b><span>${esc(nameList(notDone))}</span></div>`
      : `<div class="who-line ok"><b>전원 처리완료</b></div>`;
  }
  return `<div class="chk"><div class="avs">${mem.map(m=>av(m, avCls(n,m))).join("")}</div>${lines}</div>`;
}

/* --- 변경 이력 --- */
function lineDiff(a, b){
  const A = String(a||"").split("\n"), B = String(b||"").split("\n");
  if(A.length*B.length > 250000) return [{t:"d",s:"(내용이 길어 전체 비교를 생략했습니다)"}];
  const m=A.length, n=B.length, L = Array.from({length:m+1},()=>new Int32Array(n+1));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--) L[i][j] = A[i]===B[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  const out=[]; let i=0,j=0;
  while(i<m && j<n){
    if(A[i]===B[j]){ out.push({t:"s",s:A[i]}); i++; j++; }
    else if(L[i+1][j] >= L[i][j+1]) out.push({t:"d",s:A[i++]});
    else out.push({t:"a",s:B[j++]});
  }
  while(i<m) out.push({t:"d",s:A[i++]});
  while(j<n) out.push({t:"a",s:B[j++]});
  // 바뀐 줄 주변만 남기고 같은 줄은 접기
  const keep = out.map((o,k)=> o.t!=="s" || out.slice(Math.max(0,k-1),k+2).some(x=>x.t!=="s"));
  const res=[]; let skipped=0;
  out.forEach((o,k)=>{ if(keep[k]){ if(skipped){ res.push({t:"x",s:`… 같은 내용 ${skipped}줄 …`}); skipped=0; } res.push(o); } else skipped++; });
  if(skipped) res.push({t:"x",s:`… 같은 내용 ${skipped}줄 …`});
  return res;
}
function fmtVal(f, v){
  if(f==="important"||f==="needAction") return (v===true||v==="true") ? "예" : "아니오";
  if(v===""||v==null) return "(없음)";
  return String(v);
}
function changesHTML(changes){
  return `<div class="chg">${(changes||[]).map(c => {
    if(c.f==="body" || c.f==="links"){
      const d = lineDiff(c.from, c.to);
      return `<div><span class="f">${FIELDS[c.f]}</span></div><div class="diff">${d.map(o=>`<div class="${o.t==="x"?"s":o.t==="s"?"":o.t}">${esc(o.s)||"&nbsp;"}</div>`).join("")}</div>`;
    }
    return `<div><span class="f">${FIELDS[c.f]||c.f}</span><del>${esc(fmtVal(c.f,c.from))}</del> → <ins>${esc(fmtVal(c.f,c.to))}</ins></div>`;
  }).join("")}</div>`;
}
const ACT = {create:"등록",edit:"수정",delete:"삭제",read:"확인",ack:"체크",done:"처리완료",undo:"취소",comment:"댓글",member:"팀원",setting:"설정"};
function logDetail(l){
  if(l.type==="edit" || l.type==="setting") return changesHTML(l.changes);
  if(l.type==="comment") return `<div class="quote">${esc(l.text)}</div>`;
  if(l.type==="undo") return `<div class="meta" style="margin-top:4px">${({done:"처리완료",ack:"체크",read:"확인"})[l.what]||"체크"}를 취소했습니다</div>`;
  if(l.type==="delete" && l.snapshot && l.snapshot.body) return `<div class="quote">${esc(l.snapshot.body.slice(0,300))}${l.snapshot.body.length>300?"…":""}</div>`;
  return "";
}
function renderLog(){
  const list = filteredLogs();
  if(!list.length){ $("#view").innerHTML = `<div class="empty"><div class="serif">기록이 없습니다</div>공지를 등록하거나 수정하면 여기에 날짜별로 쌓입니다.</div>`; return; }
  const groups = {};
  list.forEach(l => (groups[ymd(l.at)] = groups[ymd(l.at)] || []).push(l));
  const exists = id => Store.notices.some(n=>n.id===id);
  $("#view").innerHTML = Object.keys(groups).sort().reverse().map(d => {
    const g = groups[d], cnt = t => g.filter(l=>l.type===t).length;
    const sum = [["create","등록"],["edit","수정"],["delete","삭제"],["read","확인"],["ack","체크"],["done","처리"],["setting","설정"],["comment","댓글"]]
      .filter(([t])=>cnt(t)).map(([t,l])=>`${l} ${cnt(t)}`).join(" · ");
    return `<section class="day">
      <div class="day-h"><h3>${dayTitle(d)}</h3>${dayRel(d)?`<span class="rel">${dayRel(d)}</span>`:""}<span class="cnt">${sum}</span></div>
      <div class="card">${g.map(l => {
        const alive = l.noticeId && exists(l.noticeId);
        return `<div class="lg">
          <div class="tm2">${hm(l.at)}</div>
          <div>
            <div class="top">${av(l.by||"?", "n")}<span class="by" title="${esc(l.account||"")}">${esc(l.by||"이름 없음")}</span>
              <span class="act ${l.type}">${ACT[l.type]||l.type}</span>
              ${l.cat?`<span class="cat" ${cs(l.cat)}><span class="dot"></span>${esc(l.cat)}</span>`:""}
              <span class="ref ${l.type==="member"||l.type==="setting"?"":alive?"":"gone"}" ${alive?`data-open="${l.noticeId}"`:""}>${esc(l.title)}</span>
            </div>
            ${logDetail(l)}
          </div></div>`;
      }).join("")}</div></section>`;
  }).join("");
}

/* --- 상세 패널 --- */
const BLOBS = {};   // 첨부 id → 내려받은 파일(Blob URL)
async function blobUrl(f){
  if(!BLOBS[f.id]) BLOBS[f.id] = Store.fileBlob(f).then(b => URL.createObjectURL(b));
  return BLOBS[f.id];
}
function loadThumbs(n){
  (n.files||[]).forEach(f => {
    if(fkind(f) !== "img") return;
    blobUrl(f).then(u => {
      const el = document.querySelector(`[data-thumb="${CSS.escape(f.id)}"]`);
      if(el) el.innerHTML = `<img src="${u}" alt="${esc(f.name)}">`;
    }).catch(() => {
      const el = document.querySelector(`[data-thumb="${CSS.escape(f.id)}"]`);
      if(el) el.innerHTML = `<span>미리보기를 불러오지 못했습니다</span>`;
    });
  });
}
async function fileAction(nid, i, open){
  const n = Store.notices.find(x=>x.id===nid); const f = n && (n.files||[])[+i]; if(!f) return;
  try{
    toast(open ? "여는 중…" : "내려받는 중…");
    const u = await blobUrl(f);
    if(open && fkind(f)==="img"){ openLB(u, f); return; }
    if(open){ window.open(u, "_blank"); return; }
    const a = document.createElement("a"); a.href = u; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ fail(e); }
}
let LB_FILE = null;
function openLB(u, f){ LB_FILE = f; $("#lbImg").src = u; $("#lbName").textContent = f.name || ""; $("#lb").classList.add("on"); }
function closeLB(){ $("#lb").classList.remove("on"); $("#lbImg").removeAttribute("src"); LB_FILE = null; }
function lbOpen(){ return $("#lb").classList.contains("on"); }
function openDrawer(){ $("#drawer").classList.add("on"); $("#scrim").classList.add("on"); }
function closeDrawer(){ $("#drawer").classList.remove("on"); $("#scrim").classList.remove("on"); S.openId=null; }

      <div class="meta">
        <span>게시 ${esc(n.date)}</span><span>작성 ${esc(n.author||"-")}</span>
        ${n.updatedAt?`<span class="edited">최종 수정 ${mdhm(n.updatedAt)} · ${esc(n.updatedBy||"")}</span>`:""}
        ${n.needAction&&n.due?`<span class="due ${ds}">기한 ${esc(n.due)}${ds==="over"?" (지남)":""}</span>`:""}
      </div>

        <span class="seen">${isRead(n,S.me) ? `확인 <b>${esc(stamp(n.read[S.me]))}</b>` : "미확인"}</span>
        <button class="btn ${isAck(n,S.me)?"on-r":"primary"}" data-mark="ack" data-id="${n.id}" title="${isAck(n,S.me)?"다시 누르면 체크가 취소됩니다":"내용을 확인하고 인지했으면 누르세요"}">${isAck(n,S.me)?"✓ 체크함":"인지했어요 · 체크"}</button>
        ${n.needAction?`<button class="btn ${isDone(n,S.me)?"on-d":"ok"}" data-mark="done" data-id="${n.id}" title="${isDone(n,S.me)?"다시 누르면 취소됩니다":""}">${isDone(n,S.me)?"✓ 처리완료함":"처리완료"}</button>`:""}
      </div>` : `<div class="mystate"><span class="meta">현재 사용자를 선택하면 확인·체크가 기록됩니다</span></div>`}
    </div>
    <div class="dr-b">
      <div class="body">${esc(n.body||"(내용 없음)")}</div>
      ${links?`<div class="links">${links}</div>`:""}
      ${(n.files||[]).length ? `<div class="files">${n.files.map((f,i)=>`
        <div class="file ${fkind(f)}" data-fi="${i}" data-nid="${n.id}">
          ${fkind(f)==="img" ? `<div class="thumb" data-thumb="${esc(f.id)}"><span>불러오는 중…</span></div>` : ""}
          <div class="frow"><span class="att-k ${fkind(f)}">${FICON[fkind(f)]}</span><span class="att-n" title="${esc(f.name)}">${esc(f.name)}</span>
            <small>${fsize(f.size||0)}</small>

            <button class="btn sm" data-fdown="${i}" data-nid="${n.id}">내려받기</button></div>

      <div class="sec"><div class="sec-t">확인 · 체크 현황 <span style="font-weight:400;color:var(--faint)">확인 = 열어 봄 · 체크 = 인지함</span></div>

      </div>
    </div>
    <div class="dr-f">

  $("#naChk").onchange = e => $("#dueWrap").style.display = e.target.checked ? "" : "none";
  FORM_FILES = (n.files || []).map(f => ({...f}));

      FORM_FILES.push({tmp:uid(), name:file.name, type:file.type, size:file.size, file});

/* 첨부 목록 (등록·수정 창) */
let FORM_FILES = [];
const fsize = b => b >= 1048576 ? (b/1048576).toFixed(1)+"MB" : Math.max(1, Math.round(b/1024))+"KB";
const fkind = f => /^image\//.test(f.type||"") || /\.(png|jpe?g|gif|webp|bmp)$/i.test(f.name) ? "img"
  : /\.(xlsx?|csv)$/i.test(f.name) ? "xls" : /\.pdf$/i.test(f.name) ? "pdf" : "etc";
const FICON = {img:"이미지", xls:"엑셀", pdf:"PDF", etc:"파일"};
function renderAtt(){
  const el = $("#attList"); if(!el) return;
  el.innerHTML = FORM_FILES.length ? FORM_FILES.map((f,i) =>
    `<div class="att-it"><span class="att-k ${fkind(f)}">${FICON[fkind(f)]}</span><span class="att-n" title="${esc(f.name)}">${esc(f.name)}</span>
     <small>${fsize(f.size||0)}${f.tmp?" · 새 파일":""}</small><button type="button" class="x" data-attrm="${i}" title="빼기">×</button></div>`).join("")
    : `<div class="att-empty">첨부한 파일이 없습니다</div>`;
}
async function submitForm(id){
  const f = $("#nf");
  if(!f.reportValidity()) return;
  const fd = new FormData(f);
  const data = {
    cat: fd.get("cat"), date: fd.get("date"), title: fd.get("title").trim(), body: fd.get("body"),
    links: fd.get("links"), important: !!fd.get("important"), needAction: !!fd.get("needAction"),
    due: fd.get("needAction") ? fd.get("due") : ""
  };
  const btn = $("#saveBtn"); btn.disabled = true;
  try{
    // 새 첨부부터 올리고, 빠진 첨부는 지운다
    const prevFiles = id ? ((Store.notices.find(x=>x.id===id)||{}).files || []) : [];
    const pending = FORM_FILES.filter(f => f.tmp);
    const done = [];
    for(let i=0;i<pending.length;i++){
      btn.textContent = `첨부 올리는 중 ${i+1}/${pending.length}`;
      done.push(await Store.uploadFile(pending[i].file, S.me));
    }
    data.files = FORM_FILES.filter(f => !f.tmp).map(({id,name,type,size}) => ({id,name,type,size})).concat(done);
    prevFiles.filter(p => !data.files.some(f => f.id === p.id)).forEach(p => Store.deleteFile(p.id));
    btn.textContent = id ? "수정 저장" : "등록";
    if(id){ const k = await Store.updateNotice(id, data, S.me); toast(k ? `${k}개 항목을 수정했습니다` : "바뀐 내용이 없습니다"); }
    else { await Store.createNotice(data, S.me); toast("등록했습니다"); }
    closeModal();
  }catch(e){ btn.disabled = false; fail(e); }
}
function fail(e){
  console.error(e);
  const c = e.code || e.message;
  toast(/permission-denied/.test(c) ? "저장 실패: 권한 없음 (위쪽 안내를 확인하세요)" : "저장 실패: " + c);
  if(/permission-denied/.test(c)){ Store.diag.errors["저장"] = c; render(); }
}

function catAdd(){
  syncCE();
  const v = $("#catNew").value.trim(); if(!v) return;
  if(CE.some(r=>!r.del && r.name.trim()===v)) return toast("이미 있는 분류입니다");
  CE.push({id:uid(), name:v, color:PALETTE[CE.length % PALETTE.length], orig:null, origColor:null, del:false, moveTo:""});
  renderCatSettings(); setTimeout(()=>$("#catNew")&&$("#catNew").focus(),20);
}
async function catSave(){
  syncCE();
  const keep = CE.filter(r=>!r.del);
  const names = keep.map(r=>r.name.trim());
  if(!keep.length) return toast("분류는 하나 이상 있어야 합니다");
  if(names.some(n=>!n)) return toast("비어 있는 분류 이름이 있습니다");
  if(new Set(names).size !== names.length) return toast("같은 이름의 분류가 있습니다");
  const use = nm => Store.notices.filter(n=>n.cat===nm).length;
  const renames = [], moves = [], changes = [];
  keep.forEach(r => {
    const nm = r.name.trim();
    if(!r.orig) changes.push({f:"분류 추가", from:"", to:nm});
    else {
      if(nm !== r.orig){ renames.push([r.orig, nm]); changes.push({f:"이름 변경", from:r.orig, to:nm}); }
      if(r.origColor && r.color.toLowerCase() !== r.origColor.toLowerCase()) changes.push({f:"색상("+nm+")", from:r.origColor, to:r.color});
    }
  });
  CE.filter(r=>r.del && r.orig).forEach(r => {
    const cnt = use(r.orig);
    const to = names.includes(r.moveTo) ? r.moveTo : names[0];
    if(cnt) moves.push([r.orig, to]);
    changes.push({f:"분류 삭제", from:r.orig, to: cnt ? `공지 ${cnt}건 → ${to}` : "(삭제됨)"});
  });
  const oldOrder = catList().map(c=>c.name).join(" › "), newOrder = names.join(" › ");
  if(oldOrder !== newOrder && !changes.length) changes.push({f:"메뉴 순서", from:oldOrder, to:newOrder});
  else if(oldOrder !== newOrder) changes.push({f:"메뉴 구성", from:oldOrder, to:newOrder});
  const cats = keep.map(r => ({id:r.id||uid(), name:r.name.trim(), color:r.color}));
  const btn = $("#catSave"); btn.disabled = true;
  try{
    const moved = await Store.saveCats(cats, renames, moves, S.me, changes);
    if(S.cat!=="전체" && !names.includes(S.cat)) S.cat = "전체";
    closeModal(); render();
    toast(moved ? `저장했습니다 · 공지 ${moved}건의 분류도 변경` : "메뉴를 저장했습니다");
  }catch(e){ btn.disabled = false; fail(e); }
}

const FB_KEYS = ["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId","measurementId"];
function parseFbConfig(txt){
  const o = {}; let m; const re = /["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g;
  while((m = re.exec(txt))) if(FB_KEYS.includes(m[1])) o[m[1]] = m[2];
  return o.apiKey && o.projectId ? o : null;
}
function renderFbSettings(){
  const cur = FBC.apiKey ? FBC : null;
  openModal(`
    <div class="mh"><h2>Firebase 연결 설정</h2><button class="x" data-mclose>×</button></div>
    <div class="mb">
      <p class="note" style="margin-top:0">Firebase 콘솔 › 프로젝트 설정(톱니바퀴) › 일반 › 내 앱에 있는 <b>const firebaseConfig = { … }</b> 부분을 통째로 복사해 붙여넣으세요.</p>
      <textarea class="field" id="fbTxt" style="width:100%;min-height:170px;font-family:ui-monospace,Consolas,monospace;font-size:12px" placeholder='const firebaseConfig = {

};'></textarea>

      <div class="note">현재 상태: ${cur ? `<b>${esc(cur.projectId)}</b> 프로젝트에 연결 (${FBC_FROM_BROWSER ? "이 브라우저에 저장된 설정" : "파일에 들어 있는 설정"})` : "연결 안 됨 (체험 모드)"}</div>
      <div class="fb-opts">
        <div><b>① 이 브라우저에 저장하고 연결</b><span>지금 이 PC에서 바로 연결됩니다. 다른 팀원 PC에서는 각자 같은 설정을 넣어야 합니다.</span></div>
        <div><b>② 설정이 들어간 index.html 받기</b><span>받은 파일을 사이트에 올리거나 팀원에게 나눠 주면, 누구든 열자마자 연결됩니다. 팀 공유에는 이 방법을 권합니다.</span></div>
      </div>
    </div>
    <div class="mf">
      ${FBC_FROM_BROWSER ? `<button class="btn quiet danger" id="fbClear">브라우저 설정 지우기</button><span style="flex:1"></span>` : ""}
      <button class="btn" id="fbSave">① 저장하고 연결</button>
      <button class="btn primary" id="fbDown">② index.html 받기</button>
    </div>`);
  if(cur) $("#fbTxt").value = "const firebaseConfig = " + JSON.stringify(Object.fromEntries(FB_KEYS.filter(k=>cur[k]).map(k=>[k,cur[k]])), null, 2) + ";";
}
function readFbInput(){
  const c = parseFbConfig($("#fbTxt").value);
  if(!c){ $("#fbErr").textContent = "apiKey와 projectId를 찾지 못했습니다. firebaseConfig 부분을 그대로 붙여넣었는지 확인하세요."; return null; }
  return c;
}
function fbSave(){
  const c = readFbInput(); if(!c) return;
  LS.set("nb_fbconfig", c);
  const back = LS.get("nb_fbconfig", null);
  if(!back || back.apiKey !== c.apiKey){
    $("#fbErr").textContent = "이 화면에서는 브라우저 저장이 막혀 있습니다. '② index.html 받기'로 파일을 받아 크롬에서 직접 여세요.";
    return;
  }
  toast("저장했습니다. 다시 불러옵니다…");

function fbClear(){
  if(!confirm("이 브라우저에 저장된 Firebase 설정을 지우고 체험 모드로 돌아갈까요?")) return;
  try{ localStorage.removeItem("nb_fbconfig"); }catch(e){}
  location.reload();
}
function fbDownload(){
  const c = readFbInput(); if(!c) return;
  const doc = document.documentElement.cloneNode(true);
  // 화면에 그려진 내용은 비우고 원래 틀만 남김
  ["#view","#navView","#navCat","#bandWrap","#diag","#banner","#drawer","#modal","#demoNote","#acct","#chips"].forEach(sel => { const el = doc.querySelector(sel); if(el) el.innerHTML = ""; });
  const tb = doc.querySelector("#toolbar"); if(tb) tb.innerHTML = "";
  ["#scrim","#drawer","#mw","#toast"].forEach(sel => { const el = doc.querySelector(sel); if(el) el.className = el.className.replace(/\s*\bon\b/g,""); });
  const lg = doc.querySelector("#login"); if(lg) lg.setAttribute("hidden","");
  doc.removeAttribute("data-theme");
  const block = "const FIREBASE_CONFIG = {\n" + FB_KEYS.filter(k=>c[k]).map(k=>`  ${k}: ${JSON.stringify(c[k])}`).join(",\n") + "\n};";
  let ok = false;
  doc.querySelectorAll("script").forEach(sc => {
    if(sc.textContent.includes("const FIREBASE_CONFIG = {")){
      sc.textContent = sc.textContent.replace(/const FIREBASE_CONFIG = \{[\s\S]*?\};/, block); ok = true;
    }
  });
  if(!ok){ $("#fbErr").textContent = "파일을 만들지 못했습니다. 설정값을 알려 주시면 직접 넣어 드리겠습니다."; return; }
  const html = "<!DOCTYPE html>\n" + doc.outerHTML;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([html], {type:"text/html"}));
  a.download = "index.html";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast("index.html을 내려받았습니다");
}

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-close],[data-mclose],[data-open],[data-view],[data-cat],[data-state],[data-logtype],[data-mark],[data-cmt],[data-edit],[data-del],[data-mup],[data-mdel],[data-cup],[data-cdn],[data-cdel],[data-sw],[data-uact],button");
  // 창 바깥(어두운 배경)을 눌러도 닫히지 않음 — × 또는 취소로만 닫기
  if(e.target.id==="scrim" || e.target.id==="mw") return;
  if(e.target.closest("#lb")){
    if(e.target.id==="lbX" || e.target.id==="lb") closeLB();
    else if(e.target.id==="lbDown" && LB_FILE){ const a=document.createElement("a"); a.href=$("#lbImg").src; a.download=LB_FILE.name; document.body.appendChild(a); a.click(); a.remove(); }
    return;
  }
  const th = e.target.closest(".thumb img");
  if(th){ const fe = th.closest("[data-fi]"); if(fe) return fileAction(fe.dataset.nid, fe.dataset.fi, true); }
  const fb = e.target.closest("[data-attrm],[data-fopen],[data-fdown]");
  if(fb){
    if(fb.dataset.attrm != null){ FORM_FILES.splice(+fb.dataset.attrm, 1); renderAtt(); return; }
    return fileAction(fb.dataset.nid, fb.dataset.fopen != null ? fb.dataset.fopen : fb.dataset.fdown, fb.dataset.fopen != null);
  }
  if(!el) return;
  const D = el.dataset;
  if("close" in D) return closeDrawer();
  if("mclose" in D){ closeModal(); if(D.view){ S.view = D.view; render(); } return; }
  if(D.open) return renderDrawer(D.open);
  if(D.view){ S.view = D.view; S.q=""; window.scrollTo(0,0); return render(); }
  if(D.cat){ S.cat = D.cat; return render(); }
  if(D.state){ S.state = D.state; if(S.view==="log") S.view="list"; return render(); }
  if(D.logtype){ S.logType = D.logtype; S.view="log"; return render(); }
  if(D.mark){
    const n = Store.notices.find(x=>x.id===D.id), k = D.mark, on = !(n[k] && n[k][S.me]);
    try{
      await Store.setMark(n.id, k, S.me, on);
      if(on && (k==="ack"||k==="done") && !isRead(n,S.me)) await Store.setMark(n.id, "read", S.me, true);
      if(on && k==="done" && !isAck(n,S.me)) await Store.setMark(n.id, "ack", S.me, true);
      toast(on ? (k==="ack" ? "체크했습니다" : "처리완료로 표시했습니다") : (k==="ack" ? "체크를 취소했습니다" : "처리완료를 취소했습니다"));
    }catch(err){ fail(err); }
    return;
  }
  if(D.cmt){
    const v = $("#cmIn").value.trim(); if(!v) return;
    $("#cmIn").value = "";
    try{ await Store.addComment(D.cmt, v, S.me); }catch(err){ fail(err); }
    return;
  }
  if(D.edit) return renderForm(D.edit);
  if(D.del){
    const n = Store.notices.find(x=>x.id===D.del);
    if(!confirm(`'${n.title}' 공지를 삭제할까요?\n삭제 기록은 변경 이력에 남지만 체크 기록은 사라집니다.`)) return;
    try{ await Store.deleteNotice(D.del, S.me); closeDrawer(); toast("삭제했습니다"); }catch(err){ fail(err); }
    return;
  }
  if(D.mdel){
    const name = M()[+D.mdel];
    if(!confirm(name + " 님을 팀원 목록에서 뺄까요?")) return;
    await Store.setMembers(M().filter(m=>m!==name), S.me, `팀원 삭제: ${name}`); renderMembers(); return;
  }
  if(D.uact) return userAction(D.uact, D.uid);
  if(D.cup){ syncCE(); const i=+D.cup; if(i>0){ [CE[i-1],CE[i]]=[CE[i],CE[i-1]]; renderCatSettings(); } return; }
  if(D.cdn){ syncCE(); const i=+D.cdn; if(i<CE.length-1){ [CE[i+1],CE[i]]=[CE[i],CE[i+1]]; renderCatSettings(); } return; }
  if(D.cdel){ syncCE(); const i=+D.cdel, r=CE[i]; if(!r.orig) CE.splice(i,1); else r.del=!r.del; renderCatSettings(); return; }
  if(D.sw){ syncCE(); const r=CE[+D.swi]; if(r){ r.color = D.sw; renderCatSettings(); } return; }
  if(D.mup){
    const i = +D.mup, L = [...M()]; [L[i-1],L[i]] = [L[i],L[i-1]];
    await Store.setMembers(L); renderMembers(); return;
  }
  switch(el.id){
    case "saveBtn": return submitForm(D.id);
    case "loginBtn": return doLogin();
    case "signupBtn": return doSignup();
    case "nameBtn": return doSetName();
    case "toSignup": LG.mode = "signup"; return renderLogin();
    case "toLogin": LG.mode = "login"; return renderLogin();
    case "logoutBtn2": LG.mode = "login"; return Store.logout();
    case "resetBtn": return doReset();
    case "logoutBtn": if(confirm("로그아웃할까요?")) { closeDrawer(); await Store.logout(); } return;
    case "newBtn": return renderForm();
    case "memBtn": return renderMembers();
    case "catSetBtn": case "catSetBtn2": return openCatSettings();
    case "catAdd": return catAdd();
    case "fbBtn": case "fbBtn2": return renderFbSettings();
    case "fbSave": return fbSave();
    case "fbClear": return fbClear();
    case "fbDown": return fbDownload();
    case "catSave": return catSave();
    case "memAdd": return addMember();
    case "themeBtn": return setTheme(document.documentElement.dataset.theme==="dark" ? "light" : "dark");
  }
});
document.addEventListener("keydown", e => {
  if(e.key==="Escape" && lbOpen()){ e.preventDefault(); e.stopImmediatePropagation(); closeLB(); }
}, true);
document.addEventListener("keydown", e => {
  if(e.key==="Escape"){ if(!$("#mw").classList.contains("on")) closeDrawer(); }
  if(e.key==="Enter" && !e.isComposing){
    if(e.target.id==="memIn") addMember();
    if(e.target.id==="catNew") catAdd();
    if(e.target.id==="cmIn") document.querySelector("[data-cmt]")?.click();
  }
});
document.addEventListener("input", e => {
  if(e.target.id==="q"){ S.q = e.target.value; render(); }
});
document.addEventListener("change", e => {
  if(e.target.id==="fMonth"){ S.month = e.target.value; render(); }
  if(e.target.id==="meSel"){ S.me = e.target.value; LS.set("nb_me", S.me); render(); }
});

function setTheme(t){
  document.documentElement.dataset.theme = t;
  $("#themeBtn").textContent = t==="dark" ? "라이트" : "다크";
  LS.set("nb_theme", t);
}
setTheme(LS.get("nb_theme", matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

Store.on(render);
render();
Store.init().then(render);
</script>
</body>
</html>
